packages:
  - catalyst-backend
  - catalyst-frontend
  - catalyst-shared
  - catalyst-plugins/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  prisma: true
  ssh2: true
# Disable pnpm's default 24-hour minimum release age policy.
# Packages like vitest are frequently updated and the policy blocks
# fresh releases, causing CI to fail on newly-generated lockfiles.
minimumReleaseAge: 0

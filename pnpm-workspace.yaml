packages:
  - catalyst-backend
  - catalyst-frontend
  - packages/*
allowBuilds:
  '@prisma/engines': true
  # i18next-cli's native parser. Its postinstall only verifies that the platform
  # binary loads (it falls back to @swc/wasm otherwise); pnpm 12 fails the
  # install outright when a dependency has an unapproved build script.
  '@swc/core': true
  cpu-features: true
  esbuild: true
  prisma: true
  ssh2: true
# Disable pnpm's default 24-hour minimum release age policy.
# Packages like vitest are frequently updated and the policy blocks
# fresh releases, causing CI to fail on newly-generated lockfiles.
minimumReleaseAge: 0
# pnpm 11+ only reads auth/registry from .npmrc. Linker/hoist settings must live here
# (see https://pnpm.io/settings). Keep hoisted layout for local dev + Docker expectations.
nodeLinker: hoisted
# pnpm 10+ no longer reads package.json "pnpm.overrides"; keep overrides here
# so CI (pnpm latest) frozen installs match the lockfile.
overrides:
  # Dependabot: force patched transitives without changing public APIs.
  # Replacement values are capped at the next major so a forced upgrade can
  # never cross a breaking boundary (an uncapped ">=x" floats to the newest
  # version overall, e.g. vitest 5 / js-yaml 5 / nodemailer 10).
  '@babel/core': 7.29.7
  '@radix-ui/react-compose-refs': 1.1.5
  '@radix-ui/react-slot': 1.3.3
  '@simplewebauthn/server@<=13.3.1': '>=13.3.2 <14'
  '@vitest/mocker@>=2.1.0 <4.1.11': '>=4.1.11 <5'
  'brace-expansion@5': 5.0.9
  deepmerge-ts@<8.0.0: '>=8.0.0 <9'
  dompurify: 3.4.13
  # fast-uri: URI-confusion advisories; patched in 3.1.6+ (v3) and 4.1.3+ (v4).
  'fast-uri@3': 3.1.7
  'fast-uri@4': 4.1.4
  fastify@<5.12.1: '>=5.12.1 <6'
  fastify@>=5.8.3 <5.12.1: '>=5.12.1 <6'
  find-my-way: 9.7.0
  'js-yaml@4': 4.3.1
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2 <5'
  mysql2@<3.22.0: '>=3.22.0 <4'
  mysql2@<=3.23.0: '>=3.23.1 <4'
  nodemailer@<9.1.1: '>=9.1.1 <10'
  nodemailer@>=6.9.16 <9.1.1: '>=9.1.1 <10'
  vitest@>=2.1.0 <4.1.11: '>=4.1.11 <5'
  ws: 8.21.3
# extract-zip 2.0.1 is the newest release and has no patched version; both
# advisories cover symlink entries in archives. packaging.ts rejects
# non-regular entries before extraction writes them, and a .catpkg never
# legitimately contains links. Drop these when upstream ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
shamefullyHoist: true

packages:
  - catalyst-backend
  - catalyst-frontend
  - packages/*
# pnpm 11+ only reads auth/registry from .npmrc. Linker/hoist settings must live here
# (see https://pnpm.io/settings). Keep hoisted layout for local dev + Docker expectations.
nodeLinker: hoisted
shamefullyHoist: true
allowBuilds:
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  prisma: true
  ssh2: true
# Disable pnpm's default 24-hour minimum release age policy.
# Packages like vitest are frequently updated and the policy blocks
# fresh releases, causing CI to fail on newly-generated lockfiles.
minimumReleaseAge: 0
# pnpm 10+ no longer reads package.json "pnpm.overrides"; keep overrides here
# so CI (pnpm latest) frozen installs match the lockfile.
overrides:
  '@radix-ui/react-slot': 1.3.3
  '@radix-ui/react-compose-refs': 1.1.5
  # Dependabot: force patched transitives without changing public APIs.
  # Version selectors keep js-yaml 5.x / fast-uri 4.x / brace-expansion <5 intact.
  '@babel/core': 7.29.7
  'brace-expansion@5': 5.0.9
  dompurify: 3.4.13
  'fast-uri@3': 3.1.5
  find-my-way: 9.7.0
  'js-yaml@4': 4.3.1
  ws: 8.21.3

[Service]
LimitNOFILE=1048576
LimitNOFILESoft=1048576
# Bounded: infinity lets a fork bomb wedge the node. Matches the agent unit.
TasksMax=8192
# Neutral service weights: do not boost agent housekeeping above sibling services.
# Hierarchical weights are not a cross-hierarchy cap or game-CPU reservation.
CPUWeight=100
IOWeight=100
# Mirrors the hardening in deploy-agent.sh write_systemd_unit (documented there).
# @mount is required: mount(2)/umount2(2) are not in @system-service, and without
# it loop mounts via nsenter die with SIGSYS.
ProtectHome=true
RestrictNamespaces=mnt net uts ipc
SystemCallFilter=@system-service @mount
# RestrictSUIDSGID must stay disabled: enabling it makes systemd deny
# openat2(2) with ENOSYS, and Fedora 44's GNU tar needs openat2, so backup
# restores abort with "Function not implemented" (systemd/systemd#43314).
# The main unit sets this too; the drop-in repeats it so a stale drop-in from
# an earlier tuning run cannot re-enable it.
RestrictSUIDSGID=no

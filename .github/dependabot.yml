version: 2
updates:
  # Backend + Frontend — pnpm monorepo workspace
  # Both share a single root pnpm-lock.yaml, so Dependabot must scan
  # the root directory with ecosystem "npm" (which covers pnpm too).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "catalystctl/maintainers"
    labels:
      - "dependencies"
      - "backend"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    # Allow overrides defined in pnpm-workspace.yaml to control transitive
    # patch versions, preventing Dependabot from proposing updates that
    # conflict with security-patched transitive dependencies.
    allow:
      - dependency-type: "all"

  # Agent - Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/catalyst-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "catalystctl/maintainers"
    labels:
      - "dependencies"
      - "agent"
      - "rust"
    commit-message:
      prefix: "chore(agent)"
      include: "scope"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"
      rust-major:
        update-types:
          - "major"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "catalystctl/maintainers"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Docker images in workflows and docker-compose
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "catalystctl/maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

name: Discord Notify

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
    steps:
      - name: Send Discord webhook
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG=$(jq -r '.release.tag_name' < "$GITHUB_EVENT_PATH")
            RELEASE_URL=$(jq -r '.release.html_url' < "$GITHUB_EVENT_PATH")
            RELEASE_BODY=$(jq -r '.release.body // ""' < "$GITHUB_EVENT_PATH")
            PRERELEASE=$(jq -r '.release.prerelease' < "$GITHUB_EVENT_PATH")

            if [ "$PRERELEASE" = "true" ]; then
              EMBED_TITLE="🧪 Pre-release $TAG"
              EMBED_COLOR=16776960  # yellow
            else
              EMBED_TITLE="🚀 Release $TAG"
              EMBED_COLOR=5763719  # green
            fi

            # Truncate body to fit Discord embed limits (1024 chars for description)
            if [ ${#RELEASE_BODY} -gt 1000 ]; then
              DESCRIPTION="${RELEASE_BODY:0:1000}…\n[View full release notes](<$RELEASE_URL>)"
            else
              DESCRIPTION="$RELEASE_BODY"
            fi

            EMBED_URL="$RELEASE_URL"
            WEBHOOK_URL="${DISCORD_RELEASE_WEBHOOK_URL:-$DISCORD_WEBHOOK_URL}"

          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            COMMIT_COUNT=$(jq '.commits | length' < "$GITHUB_EVENT_PATH")

            # Build commit list (max 5 shown)
            COMMITS=$(jq -r '
              .commits[-5:][] |
              "• [`" + (.id[0:7]) + "`](<" + $ENV.GITHUB_SERVER_URL + "/" + $ENV.GITHUB_REPOSITORY + "/commit/" + .id + ">) " +
              (.message | split("\n")[0])
            ' < "$GITHUB_EVENT_PATH")

            DESCRIPTION="$COMMITS"
            if [ "$COMMIT_COUNT" -gt 5 ]; then
              DESCRIPTION="$DESCRIPTION"$'\n'"… and $((COMMIT_COUNT - 5)) more"
            fi

            EMBED_TITLE="Push to \`$(echo "$GITHUB_REF" | sed 's|refs/heads/||')\` — $COMMIT_COUNT commit(s)"
            EMBED_COLOR=5814783

          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ACTION=$(jq -r '.action' < "$GITHUB_EVENT_PATH")
            PR_NUM=$(jq -r '.pull_request.number' < "$GITHUB_EVENT_PATH")
            PR_TITLE=$(jq -r '.pull_request.title' < "$GITHUB_EVENT_PATH")
            PR_URL=$(jq -r '.pull_request.html_url' < "$GITHUB_EVENT_PATH")
            PR_AUTHOR=$(jq -r '.pull_request.user.login' < "$GITHUB_EVENT_PATH")
            PR_STATE=$(jq -r '.pull_request.state' < "$GITHUB_EVENT_PATH")
            PR_MERGED=$(jq -r '.pull_request.merged' < "$GITHUB_EVENT_PATH")

            EMBED_TITLE="PR #$PR_NUM $ACTION: $PR_TITLE"
            DESCRIPTION="by \`$PR_AUTHOR\` — $PR_STATE"
            EMBED_URL="$PR_URL"

            if [ "$ACTION" = "closed" ]; then
              if [ "$PR_MERGED" = "true" ]; then
                EMBED_COLOR=5763719  # green = merged
              else
                EMBED_COLOR=15158332  # red = closed without merge
              fi
            else
              EMBED_COLOR=5814783  # blurple = opened
            fi
          fi

          ACTOR_AVATAR="https://github.com/$GITHUB_ACTOR.png"

          # Use release-specific webhook for releases, general webhook otherwise
          WEBHOOK_URL="${WEBHOOK_URL:-$DISCORD_WEBHOOK_URL}"

          jq -n \
            --arg username "Catalyst" \
            --arg avatar_url "$ACTOR_AVATAR" \
            --arg title "$EMBED_TITLE" \
            --arg description "$DESCRIPTION" \
            --arg url "${EMBED_URL:-}" \
            --argjson color "${EMBED_COLOR:-5814783}" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: (if $url != "" then $url else null end),
                color: $color,
                footer: { text: $repo },
                timestamp: now | todateiso8601
              }]
            }' | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK_URL" -d @-

        if: env.DISCORD_WEBHOOK_URL != '' || env.DISCORD_RELEASE_WEBHOOK_URL != ''

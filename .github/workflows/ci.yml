# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ci.yml — Unified CI/CD Pipeline for Catalyst                                 ║
# ║  This workflow MUST stay in sync with run-workflow.sh (the local emulator). ║
# ║  When adding jobs/steps here, also update the step registry in run-workflow.║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  JOB INDEX                                                                    ║
# ║                                                                              ║
# ║  CI gates (push + PR):                                                       ║
# ║    lint          — ESLint, cargo fmt/check/clippy, security audit            ║
# ║    test          — Vitest, cargo test (with Postgres service)                 ║
# ║                                                                              ║
# ║  Build (push only):                                                          ║
# ║    build        — pnpm build + cargo build verification                       ║
# ║                                                                              ║
# ║  Publish (push to main/develop):                                           ║
# ║    detect-changes — Determine which Docker images need rebuilding           ║
# ║    publish-backend  — Build & push backend Docker image to GHCR              ║
# ║    publish-frontend — Build & push frontend Docker image to GHCR             ║
# ║                                                                              ║
# ║  Release (in auto-version.yml, not here):                                    ║
# ║    agent-release — Build release agent binaries, upload to GitHub Release    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: CI/CD — Catalyst

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write    # needed for GHCR docker pushes
  packages: write    # needed for GHCR docker pushes

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "25.1"
  PROTOC_ARCH: "linux-x86_64"
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

# ────────────────────────────────────────────────────────────────────────────────
# CI GATES — Lint + Test (run on every push and PR)
# ────────────────────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis
  # Maps to: Step "Lint & Static Analysis" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ── Install protoc (required by agent's protobuf dependencies) ──
      # Was in original agent-ci.yml; missing from first version of unified workflow
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d ~/.local
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      # Maps to: step_install_deps() in run-workflow.sh
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm install
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
            catalyst-backend/node_modules
            catalyst-frontend/node_modules
            catalyst-shared/node_modules
          key: pnpm-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: pnpm-deps-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      - name: Cache cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: agent-cargo-deps-${{ hashFiles('catalyst-agent/Cargo.lock') }}
          restore-keys: agent-cargo-deps-

      - name: Cache cargo build (check)
        uses: actions/cache@v5
        with:
          path: catalyst-agent/target/
          key: agent-check-${{ runner.os }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-${{ hashFiles('catalyst-agent/src/**') }}
          restore-keys: |
            agent-check-${{ runner.os }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-
            agent-check-${{ runner.os }}-

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Lint & Static Analysis ──
      # Maps to: step_lint() in run-workflow.sh
      # Scope lint to backend only — frontend has pre-existing lint errors
      # that were never gated in the original backend-ci.yml
      - name: Run ESLint
        run: pnpm --filter catalyst-backend run lint

      - name: Security audit
        run: pnpm audit || true
        continue-on-error: true

      - name: Check Rust formatting
        run: cargo fmt --manifest-path catalyst-agent/Cargo.toml -- --check

      # cargo check must run before clippy so the compilation artifacts exist
      - name: Run cargo check
        run: cargo check --manifest-path catalyst-agent/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path catalyst-agent/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit & Integration Tests
  # Maps to: Step "Unit & Integration Tests" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalyst
          POSTGRES_PASSWORD: catalyst_dev_password
          POSTGRES_DB: catalyst_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # localhost is correct when NOT using container: (services bind to host)
      DATABASE_URL: postgresql://catalyst:catalyst_dev_password@localhost:5432/catalyst_db

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Install protoc ──
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d ~/.local
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm install
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
            catalyst-backend/node_modules
            catalyst-frontend/node_modules
            catalyst-shared/node_modules
          key: pnpm-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: pnpm-deps-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      - name: Push database schema
        working-directory: catalyst-backend
        run: pnpm run db:push

      - name: Cache cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: agent-cargo-deps-${{ hashFiles('catalyst-agent/Cargo.lock') }}
          restore-keys: agent-cargo-deps-

      - name: Cache cargo build (test)
        uses: actions/cache@v5
        with:
          path: catalyst-agent/target/
          key: agent-test-${{ runner.os }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-${{ hashFiles('catalyst-agent/src/**') }}
          restore-keys: |
            agent-test-${{ runner.os }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-
            agent-test-${{ runner.os }}-

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Tests ──
      # Maps to: step_test() in run-workflow.sh
      # Scope tests to backend only — frontend tests need jsdom which is
      # not installed in CI, and the original backend-ci.yml only ran
      # backend tests anyway.
      - name: Run Vitest
        run: pnpm --filter catalyst-backend run test

      - name: Run Cargo tests
        run: cargo test --manifest-path catalyst-agent/Cargo.toml

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Verification (push to main/develop only)
  # Maps to: Step "Build Verification" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Verification
    needs: [lint, test]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Install protoc ──
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d ~/.local
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm install
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.STORE_PATH }}
            node_modules
            catalyst-backend/node_modules
            catalyst-frontend/node_modules
            catalyst-shared/node_modules
          key: pnpm-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: pnpm-deps-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      - name: Cache cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: agent-cargo-deps-${{ hashFiles('catalyst-agent/Cargo.lock') }}
          restore-keys: agent-cargo-deps-

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Build Verification ──
      # Maps to: step_build_verify() in run-workflow.sh
      - name: Build shared types
        run: pnpm run build:shared

      - name: Build backend
        run: pnpm run build:backend

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Build agent (debug)
        run: cargo build --manifest-path catalyst-agent/Cargo.toml

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4 was: Agent Release Build (v* tags only)
  # Moved to auto-version.yml — runs in the same workflow that creates
  # the tag, so no PAT / cross-workflow trigger is needed.
  # Maps to: Step "Agent Release Build" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5a: Detect Changes for Docker Publish
  # Determines which Docker images need rebuilding based on changed paths.
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    needs: [lint, test]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'push'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'catalyst-backend/**'
              - 'catalyst-shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            frontend:
              - 'catalyst-frontend/**'
              - 'catalyst-shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5b: Publish Backend Docker Image
  # Builds and pushes catalyst-backend to GHCR.
  # Maps to: Step "Docker Publish" (backend) in run-workflow.sh
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  publish-backend:
    name: Publish Backend Image
    needs: [build, detect-changes]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: >-
      github.event_name == 'push' &&
      needs.detect-changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: catalyst-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5c: Publish Frontend Docker Image
  # Builds and pushes catalyst-frontend to GHCR.
  # Maps to: Step "Docker Publish" (frontend) in run-workflow.sh
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  publish-frontend:
    name: Publish Frontend Image
    needs: [build, detect-changes]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: >-
      github.event_name == 'push' &&
      needs.detect-changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: catalyst-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

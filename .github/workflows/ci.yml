# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ci.yml — Unified CI/CD Pipeline for Catalyst                                 ║
# ║  This workflow MUST stay in sync with run-workflow.sh (the local emulator). ║
# ║  When adding jobs/steps here, also update the step registry in run-workflow.║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  JOB INDEX                                                                    ║
# ║                                                                              ║
# ║  CI gates (push + PR):                                                       ║
# ║    lint          — ESLint, cargo fmt/check/clippy, security audit            ║
# ║    test          — Vitest, cargo test (with Postgres service)                 ║
# ║                                                                              ║
# ║  Build (push only):                                                          ║
# ║    build        — pnpm build + cargo build verification                       ║
# ║                                                                              ║
# ║  Publish (push to develop):                                                  ║
# ║    detect-changes — any product path → publish BOTH images                   ║
# ║    publish-backend  — GHCR image (after lint+test+detect, || build)         ║
# ║    publish-frontend — GHCR image (after lint+test+detect, || build)         ║
# ║    main image publish lives in auto-version.yml so baked versions match     ║
# ║    the tag (GITHUB_TOKEN chore(release) commits do not retrigger CI).      ║
# ║                                                                              ║
# ║  Release (in auto-version.yml, not here):                                    ║
# ║    agent-release + publish-images — agent binaries AND both GHCR images     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: CI/CD — Catalyst

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write    # needed for GHCR docker pushes
  packages: write    # needed for GHCR docker pushes

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation — CI caches dep artifacts better without it,
  # and incremental objects bloat/slow the target cache (Swatinem/rust-cache pattern).
  CARGO_INCREMENTAL: "0"
  PROTOC_VERSION: "25.1"
  PROTOC_ARCH: "linux-x86_64"
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

# Cancel superseded runs on the same ref (new pushes shouldn't wait on old ones).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────────────────────
# CI GATES — Lint + Test (run on every push and PR)
# ────────────────────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis
  # Maps to: Step "Lint & Static Analysis" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    # 2 vCPU is enough for eslint + clippy; keep free-tier-friendly.
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v6

      # Plugin frontends under catalyst-plugins/ compile into the panel build
      # (build-time discovery via import.meta.glob). The plugins live in their
      # own repo: catalystctl/catalyst-plugins.
      - name: Checkout plugins repository
        uses: actions/checkout@v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: main
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ── Install protoc (required by agent's protobuf dependencies) ──
      # Was in original agent-ci.yml; missing from first version of unified workflow
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d ~/.local
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      # Maps to: step_install_deps() in run-workflow.sh
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache the content-addressable store only. Caching package-level
      # node_modules under a hoisted layout leaves stale .bin wrappers
      # (e.g. catalyst-backend/node_modules/.bin/eslint -> ../eslint/...) that
      # break after lockfile upgrades. Store hits still keep installs fast.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-backend/package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-v2-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      # Smart cargo cache (registry + dependency target artifacts).
      # Replaces separate registry/target caches that rarely hit on the build job.
      - name: Cache Rust (lint)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalyst-agent -> target
          shared-key: agent-ci
          cache-on-failure: true

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Lint & Static Analysis ──
      # Maps to: step_lint() in run-workflow.sh
      - name: Run ESLint (backend)
        run: pnpm --filter catalyst-backend run lint

      - name: Run ESLint (frontend)
        run: pnpm --filter catalyst-frontend run lint

      - name: Security audit
        run: pnpm audit || true
        continue-on-error: true

      - name: Check Rust formatting
        run: cargo fmt --manifest-path catalyst-agent/Cargo.toml -- --check

      # cargo check must run before clippy so the compilation artifacts exist
      - name: Run cargo check
        run: cargo check --manifest-path catalyst-agent/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path catalyst-agent/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit & Integration Tests
  # Maps to: Step "Unit & Integration Tests" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalyst
          POSTGRES_PASSWORD: catalyst_dev_password
          POSTGRES_DB: catalyst_db
        options: >-
          --health-cmd "pg_isready -U catalyst -d catalyst_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # localhost is correct when NOT using container: (services bind to host)
      DATABASE_URL: postgresql://catalyst:catalyst_dev_password@localhost:5432/catalyst_db
      # Required by api-key-service hashApiKey (no fallback secret since security review).
      # agent-auth tests call createApiKey in beforeAll and fail hard without this.
      API_KEY_SECRET: ci-test-api-key-secret-do-not-use-in-production
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v6

      - name: Checkout plugins repository
        uses: actions/checkout@v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: main
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Install protoc ──
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d ~/.local
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache the content-addressable store only. Caching package-level
      # node_modules under a hoisted layout leaves stale .bin wrappers
      # (e.g. catalyst-backend/node_modules/.bin/eslint -> ../eslint/...) that
      # break after lockfile upgrades. Store hits still keep installs fast.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-backend/package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-v2-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      - name: Push database schema
        working-directory: catalyst-backend
        run: pnpm run db:push

      - name: Cache Rust (test)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalyst-agent -> target
          shared-key: agent-ci
          cache-on-failure: true

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Tests ──
      # Maps to: step_test() in run-workflow.sh
      # Scope tests to backend only — frontend tests need jsdom which is
      # not installed in CI, and the original backend-ci.yml only ran
      # backend tests anyway.
      - name: Run Vitest
        run: pnpm --filter catalyst-backend run test

      - name: Run Cargo tests
        run: cargo test --manifest-path catalyst-agent/Cargo.toml

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Verification (push to main/develop only)
  # Maps to: Step "Build Verification" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Verification
    needs: [lint, test]
    # 4 vCPU: agent debug cargo build is the bottleneck (~75s on 2 vCPU).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Checkout plugins repository
        uses: actions/checkout@v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: main
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Install protoc ──
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d ~/.local
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache the content-addressable store only. Caching package-level
      # node_modules under a hoisted layout leaves stale .bin wrappers
      # (e.g. catalyst-backend/node_modules/.bin/eslint -> ../eslint/...) that
      # break after lockfile upgrades. Store hits still keep installs fast.
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-backend/package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-v2-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      # Previously this job only cached the cargo registry — not target/ — so
      # "Build agent (debug)" recompiled everything (~75s). Share the same
      # rust-cache key as lint/test so dependency objects are reused.
      - name: Cache Rust (build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalyst-agent -> target
          shared-key: agent-ci
          cache-on-failure: true

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Build Verification ──
      # Maps to: step_build_verify() in run-workflow.sh
      - name: Build backend
        run: pnpm run build:backend

      - name: Build frontend
        run: pnpm run build:frontend

      # ponytail: SDK must build before CLI (CLI depends on @catalyst/plugin-sdk workspace link)
      - name: Build plugin SDK
        run: pnpm --filter @catalyst/plugin-sdk run build

      - name: Build plugin SDK CLI
        run: pnpm --filter @catalyst/plugin-sdk-cli run build

      - name: Build agent (debug)
        run: cargo build --manifest-path catalyst-agent/Cargo.toml

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4 was: Agent Release Build (v* tags only)
  # Moved to auto-version.yml — runs in the same workflow that creates
  # the tag, so no PAT / cross-workflow trigger is needed.
  # Maps to: Step "Agent Release Build" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5a: Detect Changes for Docker Publish
  # Determines which Docker images need rebuilding based on changed paths.
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    # Only needs lint+test green; run in parallel with Build Verification so
    # Docker publish can start as soon as both finish (not after build alone).
    needs: [lint, test]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.event_name == 'push'
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A version bump is lockstep: backend, frontend, and agent all ship
          # the same semver. Any product-surface change republishes BOTH images
          # on develop. On main, auto-version.yml publishes both from the tag.
          filters: |
            release:
              - 'catalyst-backend/**'
              - 'catalyst-frontend/**'
              - 'catalyst-agent/**'
              - 'scripts/deploy-agent.sh'
              - 'catalyst-docker/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5b: Publish Backend Docker Image
  # Builds and pushes catalyst-backend to GHCR.
  # Maps to: Step "Docker Publish" (backend) in run-workflow.sh
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  publish-backend:
    name: Publish Backend Image
    # Docker build is independent of the TypeScript/cargo verify job — only wait
    # for gates + path detect. Overlaps with Build Verification wall-clock.
    needs: [lint, test, detect-changes]
    # 4 vCPU helps native module compile (ssh2/cpu-features) inside the image.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.detect-changes.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: catalyst-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5c: Publish Frontend Docker Image
  # Builds and pushes catalyst-frontend to GHCR.
  # Maps to: Step "Docker Publish" (frontend) in run-workflow.sh
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  publish-frontend:
    name: Publish Frontend Image
    needs: [lint, test, detect-changes]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.detect-changes.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Checkout plugins repository
        uses: actions/checkout@v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: main
          path: catalyst-plugins

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: catalyst-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

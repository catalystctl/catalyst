    timeout-minutes: 40
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.detect-changes.outputs.release == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout plugins repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: 4e735b0411a67e54a38e9fdf5fb85e4ec55ff569 # pinned main 2026-09-10
          path: catalyst-plugins

      - name: Log in to GHCR
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${{ env.REGISTRY }}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build-push
        run: |
          set -euo pipefail
          # vfs storage: overlay is unusable nested inside the runner
          # container (overlayfs backing fs, no fuse mount helper), so every
          # buildah invocation pins vfs explicitly.
          STORE_ARGS=(--storage-driver vfs)
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_ARGS+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          LABEL_ARGS=()
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            LABEL_ARGS+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"
          IIDFILE="$(mktemp)"
          buildah "${STORE_ARGS[@]}" build --isolation chroot \
            "${TAG_ARGS[@]}" "${LABEL_ARGS[@]}" \
            --iidfile "$IIDFILE" \
            -f catalyst-frontend/Dockerfile .
          IID="$(cat "$IIDFILE")"
          FIRST_TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -v '^$' | head -1)"
          DIGEST_FILE="$(mktemp)"
          buildah "${STORE_ARGS[@]}" push --digestfile "$DIGEST_FILE" "$IID" "docker://$FIRST_TAG"
          RAW_DIGEST="$(cat "$DIGEST_FILE")"
          RAW_DIGEST="${RAW_DIGEST#sha256:}"
          DIGEST="sha256:$RAW_DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$FIRST_TAG" ] && continue
            buildah "${STORE_ARGS[@]}" push "$IID" "docker://$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          # No local cleanup: container storage vanishes with the ephemeral runner.

      - name: Attest image provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-frontend
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

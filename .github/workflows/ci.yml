# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ci.yml — Unified CI/CD Pipeline for Catalyst                                 ║
# ║  This workflow MUST stay in sync with run-workflow.sh (the local emulator). ║
# ║  When adding jobs/steps here, also update the step registry in run-workflow.║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  JOB INDEX                                                                    ║
# ║                                                                              ║
# ║  CI gates (push + PR):                                                       ║
# ║    lint          — ESLint, cargo fmt/check/clippy, security audit            ║
# ║    test          — Vitest, cargo test (with Postgres service)                 ║
# ║                                                                              ║
# ║  Build (push only):                                                          ║
# ║    build        — pnpm build + cargo build verification                       ║
# ║                                                                              ║
# ║  Publish (push to develop):                                                  ║
# ║    detect-changes — any product path → publish BOTH images                   ║
# ║    publish-backend  — GHCR image (after lint+test+detect, || build)         ║
# ║    publish-frontend — GHCR image (after lint+test+detect, || build)         ║
# ║    main image publish lives in auto-version.yml so baked versions match     ║
# ║    the tag (GITHUB_TOKEN chore(release) commits do not retrigger CI).      ║
# ║                                                                              ║
# ║  Release (in auto-version.yml, not here):                                    ║
# ║    agent-release + publish-images — agent binaries AND both GHCR images     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: CI/CD — Catalyst

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation — CI caches dep artifacts better without it,
  # and incremental objects bloat/slow the target cache (Swatinem/rust-cache pattern).
  CARGO_INCREMENTAL: "0"
  PROTOC_VERSION: "25.1"
  PROTOC_ARCH: "linux-x86_64"
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  # Single credential file shared by buildah (login/push) and the SLSA
  # attestation action, which only reads the docker default location.
  REGISTRY_AUTH_FILE: /root/.docker/config.json

# Cancel superseded runs on the same ref (new pushes shouldn't wait on old ones).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────────────────────
# CI GATES — Lint + Test (run on every push and PR)
# ────────────────────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis
  # Maps to: Step "Lint & Static Analysis" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    permissions:
      contents: read
    # Self-hosted ephemeral runners. Fork and Dependabot PRs stay on
    # GitHub-hosted ubuntu-latest and never touch our hardware.
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/'))) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64", "catalyst-ci"]') }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Plugin frontends under catalyst-plugins/ compile into the panel build
      # (build-time discovery via import.meta.glob). The plugins live in their
      # own repo: catalystctl/catalyst-plugins.
      - name: Checkout plugins repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: 4e735b0411a67e54a38e9fdf5fb85e4ec55ff569 # pinned main 2026-09-10
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      # ── Install protoc (required by agent's protobuf dependencies) ──
      # Was in original agent-ci.yml; missing from first version of unified workflow
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          # Self-hosted runners preinstall protoc; skip the download when the
          # wanted version is already on PATH.
          if command -v protoc >/dev/null 2>&1 && [ "$(protoc --version)" = "libprotoc ${{ env.PROTOC_VERSION }}" ]; then
            echo "protoc ${{ env.PROTOC_VERSION }} already installed"
            exit 0
          fi
          mkdir -p ~/.local/bin ~/.local/include
          curl -fsSL -o /tmp/protoc-${{ env.PROTOC_VERSION }}.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          echo "ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50  /tmp/protoc-${{ env.PROTOC_VERSION }}.zip" | sha256sum -c -
          unzip "/tmp/protoc-${{ env.PROTOC_VERSION }}.zip" -d ~/.local
          rm -f "/tmp/protoc-${{ env.PROTOC_VERSION }}.zip"
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      # Maps to: step_install_deps() in run-workflow.sh
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache the content-addressable store only. Caching package-level
      # node_modules under a hoisted layout leaves stale .bin wrappers
      # (e.g. catalyst-backend/node_modules/.bin/eslint -> ../eslint/...) that
      # break after lockfile upgrades. Store hits still keep installs fast.
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-backend/package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-v2-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      # Local compilation cache on the per-slot volume. Restoring a remote
      # target-dir cache costs ~20 minutes here, about as much as compiling.
      - name: Configure Rust build caching
        run: |
          if command -v sccache >/dev/null 2>&1; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_DIR=/cache/sccache"
              echo "SCCACHE_CACHE_SIZE=10G"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
            mkdir -p /cache/sccache
            echo "sccache enabled"
          else
            echo "sccache not installed, compiling directly"
          fi

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Lint & Static Analysis ──
      # Maps to: step_lint() in run-workflow.sh
      - name: Run ESLint (backend)
        run: pnpm --filter catalyst-backend run lint

      - name: Run ESLint (frontend)
        run: pnpm --filter catalyst-frontend run lint

      - name: Check translation catalogs
        run: pnpm i18n:check

      - name: Verify translation extraction is up to date
        run: pnpm --filter catalyst-frontend run i18n:verify

      - name: Check for new hardcoded strings
        run: pnpm i18n:hardcoded

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Cargo audit (blocking)
        run: |
          cargo install --locked cargo-audit 2>/dev/null || cargo install cargo-audit
          # RUSTSEC-2023-0071 (rsa Marvin Attack) has no patched release; rsa is
          # a transitive dep of russh (SFTP key exchange), not panel traffic.
          # Revisit when russh drops the rsa default feature.
          # cargo-audit selects its input with -f <lockfile>; it has no
          # --manifest-path flag.
          mkdir -p /tmp/audit-home
          printf '[advisories]\nignore = ["RUSTSEC-2023-0071"]\n' > /tmp/audit-home/audit.toml
          CARGO_HOME=/tmp/audit-home cargo audit -f catalyst-agent/Cargo.lock

      - name: Cargo deny (blocking)
        run: |
          cargo install --locked cargo-deny 2>/dev/null || cargo install cargo-deny
          # Minimal policy if the repo has no deny.toml yet: advisories +
          # default license/ban/source lints.
          if [ ! -f catalyst-agent/deny.toml ] && [ ! -f deny.toml ]; then
            printf '[advisories]\nversion = 2\n[licenses]\nversion = 2\n[bans]\nversion = 2\n[sources]\nversion = 2\n' > /tmp/catalyst-deny.toml
            cargo deny --manifest-path catalyst-agent/Cargo.toml --config /tmp/catalyst-deny.toml check
          else
            cargo deny --manifest-path catalyst-agent/Cargo.toml check
          fi

      - name: Workflow lint (zizmor)
        # Advisory-only for now: the existing workflow set reports 151 findings
        # (artipacked credential persistence, template injection in
        # github-script blocks, cache poisoning). Findings surface as job
        # annotations; flipping this into a blocking gate means remediating
        # them first. advanced-security is off so the job needs no
        # security-events: write permission.
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

      - name: Check Rust formatting
        run: cargo fmt --manifest-path catalyst-agent/Cargo.toml -- --check

      # cargo check must run before clippy so the compilation artifacts exist
      - name: Run cargo check
        run: cargo check --manifest-path catalyst-agent/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path catalyst-agent/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit & Integration Tests
  # Maps to: Step "Unit & Integration Tests" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    permissions:
      contents: read
    # Self-hosted ephemeral runners. Fork and Dependabot PRs stay on
    # GitHub-hosted ubuntu-latest and never touch our hardware.
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/'))) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64", "catalyst-ci"]') }}
    timeout-minutes: 30

    # No services: block here on purpose. Self-hosted runners have no Docker
    # daemon for service containers, so the test job starts its own throwaway
    # Postgres cluster (scripts/ci/ci-postgres.sh) — one fresh cluster per job,
    # no shared state. Works identically on GitHub-hosted fallback runners.

    env:
      # localhost is correct when NOT using container: (services bind to host)
      DATABASE_URL: postgresql://catalyst:catalyst_dev_password@localhost:5432/catalyst_db
      # Required by api-key-service hashApiKey (no fallback secret since security review).
      # agent-auth tests call createApiKey in beforeAll and fail hard without this.
      API_KEY_SECRET: ci-test-api-key-secret-do-not-use-in-production
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout plugins repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: 4e735b0411a67e54a38e9fdf5fb85e4ec55ff569 # pinned main 2026-09-10
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # ── Install protoc ──
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          # Self-hosted runners preinstall protoc; skip the download when the
          # wanted version is already on PATH.
          if command -v protoc >/dev/null 2>&1 && [ "$(protoc --version)" = "libprotoc ${{ env.PROTOC_VERSION }}" ]; then
            echo "protoc ${{ env.PROTOC_VERSION }} already installed"
            exit 0
          fi
          mkdir -p ~/.local/bin ~/.local/include
          curl -fsSL -o /tmp/protoc-${{ env.PROTOC_VERSION }}.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          echo "ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50  /tmp/protoc-${{ env.PROTOC_VERSION }}.zip" | sha256sum -c -
          unzip "/tmp/protoc-${{ env.PROTOC_VERSION }}.zip" -d ~/.local
          rm -f "/tmp/protoc-${{ env.PROTOC_VERSION }}.zip"
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache the content-addressable store only. Caching package-level
      # node_modules under a hoisted layout leaves stale .bin wrappers
      # (e.g. catalyst-backend/node_modules/.bin/eslint -> ../eslint/...) that
      # break after lockfile upgrades. Store hits still keep installs fast.
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-backend/package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-v2-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      - name: Start Postgres (ephemeral per-job cluster)
        run: bash scripts/ci/ci-postgres.sh

      - name: Push database schema
        working-directory: catalyst-backend
        run: pnpm run db:push

      # Local compilation cache on the per-slot volume (see lint job).
      - name: Configure Rust build caching
        run: |
          if command -v sccache >/dev/null 2>&1; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_DIR=/cache/sccache"
              echo "SCCACHE_CACHE_SIZE=10G"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
            mkdir -p /cache/sccache
            echo "sccache enabled"
          else
            echo "sccache not installed, compiling directly"
          fi

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Tests ──
      # Maps to: step_test() in run-workflow.sh
      # Scope tests to backend only — frontend tests need jsdom which is
      # not installed in CI, and the original backend-ci.yml only ran
      # backend tests anyway.
      - name: Run Vitest
        run: pnpm --filter catalyst-backend run test

      - name: Run Cargo tests
        run: cargo test --manifest-path catalyst-agent/Cargo.toml

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3: Build Verification (push to main/develop only)
  # Maps to: Step "Build Verification" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Verification
    permissions:
      contents: read
    needs: [lint, test]
    # Push-only (forks never trigger push on this repo), so self-hosted directly.
    runs-on: [self-hosted, Linux, X64, catalyst-ci]
    timeout-minutes: 25
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout plugins repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: 4e735b0411a67e54a38e9fdf5fb85e4ec55ff569 # pinned main 2026-09-10
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # ── Install protoc ──
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          # Self-hosted runners preinstall protoc; skip the download when the
          # wanted version is already on PATH.
          if command -v protoc >/dev/null 2>&1 && [ "$(protoc --version)" = "libprotoc ${{ env.PROTOC_VERSION }}" ]; then
            echo "protoc ${{ env.PROTOC_VERSION }} already installed"
            exit 0
          fi
          mkdir -p ~/.local/bin ~/.local/include
          curl -fsSL -o /tmp/protoc-${{ env.PROTOC_VERSION }}.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          echo "ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50  /tmp/protoc-${{ env.PROTOC_VERSION }}.zip" | sha256sum -c -
          unzip "/tmp/protoc-${{ env.PROTOC_VERSION }}.zip" -d ~/.local
          rm -f "/tmp/protoc-${{ env.PROTOC_VERSION }}.zip"
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Dependency Install ──
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # Cache the content-addressable store only. Caching package-level
      # node_modules under a hoisted layout leaves stale .bin wrappers
      # (e.g. catalyst-backend/node_modules/.bin/eslint -> ../eslint/...) that
      # break after lockfile upgrades. Store hits still keep installs fast.
      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-backend/package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-v2-${{ runner.os }}-

      - name: Cache Prisma Client
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules/.prisma
          key: prisma-client-${{ hashFiles('catalyst-backend/prisma/schema.prisma') }}

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Generate Prisma Client
        working-directory: catalyst-backend
        run: npx prisma generate

      # Local compilation cache on the per-slot volume (see lint job).
      # Shares dep objects with lint/test through sccache instead of a
      # downloaded target dir.
      - name: Configure Rust build caching
        run: |
          if command -v sccache >/dev/null 2>&1; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_DIR=/cache/sccache"
              echo "SCCACHE_CACHE_SIZE=10G"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
            mkdir -p /cache/sccache
            echo "sccache enabled"
          else
            echo "sccache not installed, compiling directly"
          fi

      - name: Install cargo dependencies
        run: cargo fetch --manifest-path catalyst-agent/Cargo.toml

      # ── Build Verification ──
      # Maps to: step_build_verify() in run-workflow.sh
      - name: Build backend
        run: pnpm run build:backend

      - name: Build frontend
        run: pnpm run build:frontend

      # ponytail: SDK must build before CLI (CLI depends on @catalyst/plugin-sdk workspace link)
      - name: Build plugin SDK
        run: pnpm --filter @catalyst/plugin-sdk run build

      - name: Build plugin SDK CLI
        run: pnpm --filter @catalyst/plugin-sdk-cli run build

      - name: Build agent (debug)
        run: cargo build --manifest-path catalyst-agent/Cargo.toml

      - name: Checksum build artifacts
        run: |
          sha256sum catalyst-agent/target/debug/catalyst-agent | tee /tmp/agent-debug.sha256
          cat /tmp/agent-debug.sha256

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4 was: Agent Release Build (v* tags only)
  # Moved to auto-version.yml — runs in the same workflow that creates
  # the tag, so no PAT / cross-workflow trigger is needed.
  # Maps to: Step "Agent Release Build" in run-workflow.sh
  # ──────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5a: Detect Changes for Docker Publish
  # Determines which Docker images need rebuilding based on changed paths.
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    permissions:
      contents: read
    # Needs nothing but a checkout: runs in wave 1 alongside lint/test so
    # publish jobs can start the moment lint+test go green.
    runs-on: [self-hosted, Linux, X64, catalyst-ci]
    timeout-minutes: 10
    if: github.event_name == 'push'
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # A version bump is lockstep: backend, frontend, and agent all ship
          # the same semver. Any product-surface change republishes BOTH images
          # on develop. On main, auto-version.yml publishes both from the tag.
          filters: |
            release:
              - 'catalyst-backend/**'
              - 'catalyst-frontend/**'
              - 'catalyst-agent/**'
              - 'scripts/deploy-agent.sh'
              - 'catalyst-docker/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5b: Publish Backend Docker Image
  # Builds and pushes catalyst-backend to GHCR.
  # Maps to: Step "Docker Publish" (backend) in run-workflow.sh
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  publish-backend:
    name: Publish Backend Image
    permissions:
      contents: read
      packages: write
      id-token: write # SLSA provenance via attest-build-provenance
      attestations: write
    # Docker build is independent of the TypeScript/cargo verify job — only wait
    # for gates + path detect. Overlaps with Build Verification wall-clock.
    needs: [lint, test, detect-changes]
    # Push-only (forks never trigger push on this repo), so self-hosted directly.
    # Images build via buildah chroot isolation — no Docker daemon socket is
    # ever exposed to jobs.
    runs-on: [self-hosted, Linux, X64, catalyst-ci]
    timeout-minutes: 40
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.detect-changes.outputs.release == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${{ env.REGISTRY }}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build-push
        run: |
          set -euo pipefail
          # vfs storage: overlay is unusable nested inside the runner
          # container (overlayfs backing fs, no fuse mount helper), so every
          # buildah invocation pins vfs explicitly.
          STORE_ARGS=(--storage-driver vfs)
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_ARGS+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          LABEL_ARGS=()
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            LABEL_ARGS+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"
          IIDFILE="$(mktemp)"
          buildah "${STORE_ARGS[@]}" build --isolation chroot \
            "${TAG_ARGS[@]}" "${LABEL_ARGS[@]}" \
            --iidfile "$IIDFILE" \
            -f catalyst-backend/Dockerfile .
          IID="$(cat "$IIDFILE")"
          FIRST_TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -v '^$' | head -1)"
          DIGEST_FILE="$(mktemp)"
          buildah "${STORE_ARGS[@]}" push --digestfile "$DIGEST_FILE" "$IID" "docker://$FIRST_TAG"
          RAW_DIGEST="$(cat "$DIGEST_FILE")"
          RAW_DIGEST="${RAW_DIGEST#sha256:}"
          DIGEST="sha256:$RAW_DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$FIRST_TAG" ] && continue
            buildah "${STORE_ARGS[@]}" push "$IID" "docker://$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          # No local cleanup: container storage vanishes with the ephemeral runner.

      - name: Attest image provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/catalyst-backend
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5c: Publish Frontend Docker Image
  # Builds and pushes catalyst-frontend to GHCR.
  # Maps to: Step "Docker Publish" (frontend) in run-workflow.sh
  # Merged from: docker-publish.yml
  # ──────────────────────────────────────────────────────────────────────────────
  publish-frontend:
    name: Publish Frontend Image
    permissions:
      contents: read
      packages: write
      id-token: write # SLSA provenance via attest-build-provenance
      attestations: write
    needs: [lint, test, detect-changes]

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  dependabot-review.yml — Supply Chain Security Gate for Dependabot PRs        ║
# ║                                                                              ║
# ║  Runs automatically on Dependabot pull requests to:                          ║
# ║    1. Scan for malware & supply chain attacks (Socket Firewall)              ║
# ║    2. Audit known vulnerabilities (pnpm audit)                               ║
# ║    3. Review lockfile changes for unexpected additions / install scripts    ║
# ║    4. Check OSSF Scorecard                                                   ║
# ║    5. Post a summary comment on the PR                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: Supply Chain Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  security-events: write

# Only run on Dependabot PRs — detect by branch prefix.
# Branch prefix check handles re-opened PRs where the actor is a human.
concurrency:
  group: supply-chain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Gate 1: Socket Firewall — malware & supply chain scan
  # Socket Firewall monitors dependency installation and catches:
  # malware, typosquatting, install scripts, obfuscated code,
  # token leaks, and suspicious package metadata.
  # ──────────────────────────────────────────────────────────────────────────────
  socket-scan:
    name: Socket Supply Chain Scan
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # Socket Firewall wraps the install command and blocks malicious packages
      - name: Install Socket Firewall
        uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free

      - name: Install & scan dependencies
        run: sfw pnpm install --config.minimumReleaseAge=0

  # ──────────────────────────────────────────────────────────────────────────────
  # Gate 2: Vulnerability audit (pnpm audit)
  # Checks all workspaces for known CVEs in dependencies.
  # ──────────────────────────────────────────────────────────────────────────────
  vulnerability-audit:
    name: Vulnerability Audit
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # NOT using --frozen-lockfile because Dependabot PRs change the lockfile
      - name: Install dependencies
        run: pnpm install --config.minimumReleaseAge=0

      # ── Audit the PR's branch ──
      - name: Audit backend dependencies (PR branch)
        working-directory: catalyst-backend
        run: pnpm audit 2>&1 | tee /tmp/pr-backend-audit.txt || true

      - name: Audit frontend dependencies (PR branch)
        working-directory: catalyst-frontend
        run: pnpm audit 2>&1 | tee /tmp/pr-frontend-audit.txt || true

      # ── Audit the base branch for comparison ──
      - name: Audit base branch for diff
        run: |
          git stash
          git checkout origin/${{ github.base_ref }} 2>/dev/null || true
          pnpm install --config.minimumReleaseAge=0 2>/dev/null || true
          (cd catalyst-backend && pnpm audit 2>&1 | tee /tmp/base-backend-audit.txt || true)
          (cd catalyst-frontend && pnpm audit 2>&1 | tee /tmp/base-frontend-audit.txt || true)

      # ── Compare: only fail on NEW high/critical CVEs introduced by this PR ──
      - name: Check for newly introduced vulnerabilities
        run: |
          echo "## 🔍 Vulnerability Audit" >> $GITHUB_STEP_SUMMARY

          # Current branch findings
          pr_high=$(grep -cE "^  (critical|high):" /tmp/pr-backend-audit.txt /tmp/pr-frontend-audit.txt 2>/dev/null || echo 0)
          base_high=$(grep -cE "^  (critical|high):" /tmp/base-backend-audit.txt /tmp/base-frontend-audit.txt 2>/dev/null || echo 0)

          echo "Base branch high/critical CVEs: ${base_high}" >> $GITHUB_STEP_SUMMARY
          echo "PR branch high/critical CVEs: ${pr_high}" >> $GITHUB_STEP_SUMMARY

          if [ "$pr_high" -gt "$base_high" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ New high/critical vulnerabilities introduced by this PR" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            diff <(grep -E "^  (critical|high):" /tmp/base-backend-audit.txt /tmp/base-frontend-audit.txt 2>/dev/null || true) \
                 <(grep -E "^  (critical|high):" /tmp/pr-backend-audit.txt /tmp/pr-frontend-audit.txt 2>/dev/null || true) || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::This PR introduces new high/critical severity vulnerabilities — do not merge until verified"
            exit 1
          fi

          echo "No new high/critical vulnerabilities introduced ✅" >> $GITHUB_STEP_SUMMARY
          if [ "$pr_high" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ℹ️ ${pr_high} pre-existing high/critical CVEs found — not introduced by this PR" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────────
  # Gate 3: Lockfile diff review
  # Detects unexpected package additions, typosquatting, and
  # packages with install scripts that could be malicious.
  # ──────────────────────────────────────────────────────────────────────────────
  lockfile-review:
    name: Lockfile Diff Review
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Analyze lockfile changes
        run: |
          echo "## 📦 Lockfile Change Analysis" >> $GITHUB_STEP_SUMMARY

          LOCKFILE_DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- pnpm-lock.yaml 2>/dev/null || true)

          if [ -z "$LOCKFILE_DIFF" ]; then
            echo "No lockfile changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Check for new packages added
          NEW_PKGS=$(echo "$LOCKFILE_DIFF" | grep -oP '^\+.*@"?[^@]+@"?' | grep -v '^+++' || true)

          if [ -n "$NEW_PKGS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### New packages introduced:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$NEW_PKGS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # Check for packages with install scripts (common attack vector)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checking for install scripts in new packages..." >> $GITHUB_STEP_SUMMARY

          pnpm install --config.minimumReleaseAge=0 2>/dev/null || true

          SUSPICIOUS=""
          for pkg in $(echo "$NEW_PKGS" | grep -oP '@?[^@]+@[^"]+' | sed 's/@[^@]*$//' | sort -u); do
            pkg_dir="node_modules/${pkg}"
            if [ -f "$pkg_dir/package.json" ]; then
              scripts=$(jq -r '.scripts | keys[]' "$pkg_dir/package.json" 2>/dev/null | grep -E "(install|postinstall|preinstall)" || true)
              if [ -n "$scripts" ]; then
                SUSPICIOUS="$SUSPICIOUS\n⚠️ **$pkg** has install scripts: $(echo $scripts | tr '\n' ', ')"
              fi
            fi
          done

          if [ -n "$SUSPICIOUS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Packages with install scripts detected" >> $GITHUB_STEP_SUMMARY
            echo "Install scripts can execute arbitrary code during \`npm install\`. Review carefully." >> $GITHUB_STEP_SUMMARY
            echo -e "$SUSPICIOUS" >> $GITHUB_STEP_SUMMARY
          else
            echo "No install scripts found in new packages ✅" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────────
  # Gate 4: OSSF Scorecard
  # Evaluates the repo's overall security posture.
  # ──────────────────────────────────────────────────────────────────────────────
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v7

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

  # ──────────────────────────────────────────────────────────────────────────────
  # Summary: Post a review comment on the Dependabot PR
  # ──────────────────────────────────────────────────────────────────────────────
  review-summary:
    name: Post Review Summary
    needs: [socket-scan, vulnerability-audit, lockfile-review, scorecard]
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'dependabot/') && always()
    steps:
      - uses: actions/checkout@v7

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              socket: '${{ needs.socket-scan.result }}',
              audit: '${{ needs.vulnerability-audit.result }}',
              lockfile: '${{ needs.lockfile-review.result }}',
              scorecard: '${{ needs.scorecard.result }}',
            };

            const icon = (r) => {
              if (r === 'success') return '✅';
              if (r === 'failure') return '❌';
              return '⚠️';
            };

            const body = `## 🔒 Supply Chain Security Review

            | Check | Status |
            |-------|--------|
            | Socket.dev malware scan | ${icon(results.socket)} ${results.socket} |
            | Vulnerability audit | ${icon(results.audit)} ${results.audit} |
            | Lockfile diff review | ${icon(results.lockfile)} ${results.lockfile} |
            | OSSF Scorecard | ${icon(results.scorecard)} ${results.scorecard} |

            ${results.audit === 'failure' ? '### ⚠️ Action Required\n\nCritical or high severity vulnerabilities were found. Do **not** merge until verified.' : ''}
            ${results.socket === 'failure' ? '### ⚠️ Action Required\n\nSocket.dev flagged potential supply chain issues. Review the findings above.' : ''}

            > _This review was automatically generated by the Supply Chain Review workflow._`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.replace(/^\s+/gm, ''),
            });

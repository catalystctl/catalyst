# Demo deployment — static mock of the panel on Cloudflare Pages.
#
# Builds the frontend with VITE_DEMO_MODE=true (canned fixtures, no backend)
# and publishes catalyst-frontend/dist to the `catalyst-demo` Pages project.
# Runs on pushes to main that touch the demo surface, plus manual dispatch.
# It never touches the release pipeline (auto-version.yml owns tags/images).

name: Demo — Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalyst-frontend/**'
      - 'packages/plugin-sdk/src/frontend/**'
      - 'catalyst-plugins/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-demo:
    name: Build + deploy demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout plugins repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: 4e735b0411a67e54a38e9fdf5fb85e4ec55ff569 # pinned main 2026-09-10
          path: catalyst-plugins

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-demo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'catalyst-frontend/package.json', 'packages/**/package.json') }}
          restore-keys: |
            pnpm-store-demo-${{ runner.os }}-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build demo frontend
        env:
          VITE_DEMO_MODE: 'true'
        run: pnpm --filter catalyst-frontend run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy catalyst-frontend/dist --project-name=catalyst-demo

name: Agent Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed for uploading release assets

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "25.1"
  PROTOC_ARCH: "linux-x86_64"

jobs:
  # Build release binaries and upload them to the GitHub Release.
  # This workflow runs on every version tag push (v*) regardless of paths,
  # ensuring every release has pre-built agent binaries.
  build-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: rust:1.93-bookworm

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: catalyst-agent-x86_64-linux-gnu
          - target: x86_64-unknown-linux-musl
            artifact_name: catalyst-agent-x86_64-linux-musl

    steps:
      - uses: actions/checkout@v6

      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          apt-get update && apt-get install -y unzip ca-certificates
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d /usr/local
          chmod +x /usr/local/bin/protoc

      - name: Install musl tools (for musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: apt-get update && apt-get install -y musl-tools musl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: agent-cargo-deps-${{ hashFiles('catalyst-agent/Cargo.lock') }}
          restore-keys: agent-cargo-deps-

      - name: Cache cargo build (release ${{ matrix.target }})
        uses: actions/cache@v5
        with:
          path: catalyst-agent/target/
          key: agent-release-${{ matrix.target }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-${{ hashFiles('catalyst-agent/src/**') }}
          restore-keys: |
            agent-release-${{ matrix.target }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-
            agent-release-${{ matrix.target }}-

      - name: Build release
        run: |
          cd catalyst-agent
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for release asset
        run: |
          mv "catalyst-agent/target/${{ matrix.target }}/release/catalyst-agent" "/tmp/${{ matrix.artifact_name }}"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "/tmp/${{ matrix.artifact_name }}" > "/tmp/${{ matrix.artifact_name }}.sha256"

      - name: Upload binary as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksum as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Docs impact (advisory)

# Runs the catalyst-doc docs agent in heuristic mode against the PR diff and
# posts which documentation areas are affected. Advisory only: it never blocks
# merges and never writes to either repo. Human reviewers use it to request
# matching docs updates in catalyst-doc.
#
# catalyst-doc is a standalone repo (nested checkout, not a submodule), so
# this job clones it explicitly.
on:
  pull_request:

jobs:
  docs-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          repository: catalystctl/catalyst-doc
          path: catalyst-doc
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Documentation impact report
        run: |
          node catalyst-doc/tools/docs-agent/bin/docs-agent.mjs diff \
            --source-repo . \
            --docs-repo catalyst-doc \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --dry-run

name: Auto Version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        run: |
          # Get the latest tag (fallback to root package.json version)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "No previous tag found. Using package.json version: $CURRENT_VERSION"
          else
            CURRENT_VERSION=${LATEST_TAG#v}
            echo "Latest tag: $LATEST_TAG"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Determine commit range
          if [ -z "$LATEST_TAG" ]; then
            COMMIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          fi

          # Analyze commits for bump type
          BUMP="none"

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            # Check for breaking changes (minor bump in your scheme)
            if echo "$msg" | grep -qE '^[a-z]+(\([^)]*\))?!:' || \
               echo "$msg" | grep -qiE 'BREAKING CHANGE|BREAKING-CHANGE'; then
              BUMP="minor"
              echo "Found breaking change in commit: $msg"
              break
            fi

            # Check for feat or fix (patch bump)
            if echo "$msg" | grep -qE '^(feat|fix)(\([^)]*\))?:'; then
              BUMP="patch"
              echo "Found feat/fix in commit: $msg"
            fi
          done < <(git log "$COMMIT_RANGE" --pretty=format:"%s%n%b" --)

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump type: $BUMP"

      - name: Bump version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT="${{ steps.bump.outputs.current_version }}"
          BUMP="${{ steps.bump.outputs.bump }}"

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Update package.json files
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Find all package.json files (excluding node_modules)
          mapfile -t FILES < <(find . -name 'package.json' -not -path '*/node_modules/*' -not -path './catalyst-agent/*')

          for file in "${FILES[@]}"; do
            # Skip if not a regular file
            [ -f "$file" ] || continue

            node -e "
              const fs = require('fs');
              const path = '$file';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.version) {
                pkg.version = '$VERSION';
                fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');
                console.log('Updated', path, '→', '$VERSION');
              }
            " 2>/dev/null || true
          done

      - name: Update Cargo.toml
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ -f catalyst-agent/Cargo.toml ]; then
            sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" catalyst-agent/Cargo.toml
            echo "Updated catalyst-agent/Cargo.toml → $VERSION"
          fi

      - name: Commit, tag and push
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): bump version to $VERSION" || true

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI Release Notes
        id: release_notes
        if: steps.bump.outputs.bump != 'none'
        env:
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.bump.outputs.current_version }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "❌ LLM_API_KEY secret is not set — cannot generate AI release notes"
            echo "   Add it in Settings → Secrets and variables → Actions"
            echo "FALLBACK=true" >> "$GITHUB_OUTPUT"
          fi

          PREV_TAG="v${PREVIOUS_TAG}"
          NEW_TAG="v${NEW_VERSION}"

          # Gather the commit log between the previous tag and HEAD
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          else
            COMMIT_LOG=$(git log --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          fi

          # If no commits were found, fall back to auto-generated notes
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="- No commit messages available"
          fi

          # Truncate if too long (keep within reasonable prompt size)
          COMMIT_LOG=$(echo "$COMMIT_LOG" | head -200)

          echo "Generating release notes for ${NEW_TAG}..."
          echo "Commits since ${PREV_TAG}:"
          echo "$COMMIT_LOG" | head -20

          # Build the prompt
          PROMPT="You are a release notes writer for a project called Catalyst (a game server management panel). \
          Given the following git commit messages since the previous release ($PREV_TAG), write release notes for version $NEW_TAG. \
          \
          Format requirements: \
          1. Start with a brief 1-2 sentence narrative summary of what this release delivers. \
          2. Then group changes under emoji-headed categories: \
             - ✨ **Features** — new capabilities \
             - 🐛 **Bug Fixes** — fixes and corrections \
             - 💥 **Breaking Changes** — backwards-incompatible changes \
             - 🔧 **Improvements** — refactors, perf, DX improvements \
             - 📦 **Dependencies** — dependency updates \
             - 🗑️ **Removed** — deprecated features removed \
          3. Only include categories that have relevant changes. \
          4. Rewrite commit messages into user-facing language (not internal jargon). \
          5. Keep it concise — one line per item, no redundant detail. \
          6. Do NOT wrap in markdown code fences. \
          7. Do NOT add a version header — the release title already has it. \
          \
          Commit messages: \
          ${COMMIT_LOG}"

          # Skip API call if no key configured
          if [ "${FALLBACK}" = "true" ]; then
            echo "## Changes\n\n${COMMIT_LOG}" > /tmp/release_notes.md
            echo "⚠️ Wrote fallback commit-log notes (no LLM_API_KEY)"
            exit 0
          fi

          # Call the OpenAI-compatible API
          RESPONSE=$(curl -s -f "${LLM_API_BASE}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(jq -n \
              --arg model "$LLM_MODEL" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [{ role: "user", content: $prompt }],
                temperature: 0.4,
                max_tokens: 1500
              }'
            )" 2>&1) || true

          # Extract the generated text, or fall back to the commit list
          if echo "$RESPONSE" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
            NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
            echo "✅ Successfully generated AI release notes"
          else
            echo "⚠️ AI generation failed, falling back to commit log"
            echo "API response: $(echo "$RESPONSE" | head -5)"
            NOTES="## Changes\n\n${COMMIT_LOG}"
          fi

          # Write notes to file for the next step (handles multiline)
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        if: steps.bump.outputs.bump != 'none'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          body_path: /tmp/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord on Release
        if: steps.bump.outputs.bump != 'none'
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "⊘ No DISCORD_RELEASE_WEBHOOK_URL secret set, skipping notification"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          NOTES=$(cat /tmp/release_notes.md)

          # Truncate notes to fit Discord embed description limit (1024 chars)
          if [ ${#NOTES} -gt 1000 ]; then
            DESCRIPTION="${NOTES:0:1000}…\n[View full release notes](<$RELEASE_URL>)"
          else
            DESCRIPTION="$NOTES"
          fi

          jq -n \
            --arg username "Catalyst" \
            --arg avatar_url "https://github.com/${GITHUB_REPOSITORY_OWNER}.png" \
            --arg title "🚀 Release ${TAG}" \
            --arg description "$DESCRIPTION" \
            --arg url "$RELEASE_URL" \
            --argjson color 5763719 \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                footer: { text: $repo },
                timestamp: now | todateiso8601
              }]
            }' | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_RELEASE_WEBHOOK_URL" -d @-

          echo "✅ Discord release notification sent for ${TAG}"

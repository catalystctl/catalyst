name: Auto Version

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "25.1"
  PROTOC_ARCH: "linux-x86_64"

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        run: |
          # Get the latest tag (fallback to root package.json version)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "No previous tag found. Using package.json version: $CURRENT_VERSION"
          else
            CURRENT_VERSION=${LATEST_TAG#v}
            echo "Latest tag: $LATEST_TAG"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Determine commit range
          if [ -z "$LATEST_TAG" ]; then
            COMMIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          fi

          # Analyze commits for bump type
          BUMP="none"

          while IFS= read -r msg || [[ -n "$msg" ]]; do
            [ -z "$msg" ] && continue

            # Skip chore and release commits (never trigger a bump)
            if echo "$msg" | grep -qE '^(chore|ci|build|style)(\([^)]*\))?:'; then
              echo "Skipping chore/ci/build/style commit: $msg"
              continue
            fi

            # Check for breaking changes (minor bump in your scheme)
            if echo "$msg" | grep -qE '^[a-z]+(\([^)]*\))?!:' || \
               echo "$msg" | grep -qiE 'BREAKING CHANGE|BREAKING-CHANGE'; then
              BUMP="minor"
              echo "Found breaking change in commit: $msg"
              break
            fi

            # Check for feat (minor bump)
            if echo "$msg" | grep -qE '^feat(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ] || [ "$BUMP" = "patch" ]; then
                BUMP="minor"
                echo "Found feat in commit: $msg"
              fi
              continue
            fi

            # Check for fix or refactor or perf (patch bump)
            if echo "$msg" | grep -qE '^(fix|refactor|perf|revert)(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Found fix/refactor/perf in commit: $msg"
              fi
              continue
            fi

            # Fallback: any non-chore, non-bot commit that doesn't match conventional
            # format is treated as a patch bump (prevents missed bumps)
            if echo "$msg" | grep -qvE '^(chore|ci|build|style|docs|test)(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Fallback: non-conventional commit triggers patch: $msg"
              fi
            fi
          done < <(git log "$COMMIT_RANGE" --pretty=format:"%s" --)

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump type: $BUMP"

      - name: Bump version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT="${{ steps.bump.outputs.current_version }}"
          BUMP="${{ steps.bump.outputs.bump }}"

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Update package.json files
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Find all package.json files (excluding node_modules)
          mapfile -t FILES < <(find . -name 'package.json' -not -path '*/node_modules/*' -not -path './catalyst-agent/*')

          for file in "${FILES[@]}"; do
            # Skip if not a regular file
            [ -f "$file" ] || continue

            node -e "
              const fs = require('fs');
              const path = '$file';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.version) {
                pkg.version = '$VERSION';
                fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');
                console.log('Updated', path, '→', '$VERSION');
              }
            " 2>/dev/null || true
          done

      - name: Update Cargo.toml
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ -f catalyst-agent/Cargo.toml ]; then
            sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" catalyst-agent/Cargo.toml
            echo "Updated catalyst-agent/Cargo.toml → $VERSION"
          fi

      - name: Commit, tag and push
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): bump version to $VERSION" || true

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI Release Notes
        id: release_notes
        if: steps.bump.outputs.bump != 'none'
        env:
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.bump.outputs.current_version }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "❌ LLM_API_KEY secret is not set — cannot generate AI release notes"
            echo "   Add it in Settings → Secrets and variables → Actions"
            echo "FALLBACK=true" >> "$GITHUB_OUTPUT"
          fi

          PREV_TAG="v${PREVIOUS_TAG}"
          NEW_TAG="v${NEW_VERSION}"

          # Gather the commit log between the previous tag and HEAD
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          else
            COMMIT_LOG=$(git log --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          fi

          # If no commits were found, fall back to auto-generated notes
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="- No commit messages available"
          fi

          # Truncate if too long (keep within reasonable prompt size)
          COMMIT_LOG=$(echo "$COMMIT_LOG" | head -200)

          echo "Generating release notes for ${NEW_TAG}..."
          echo "Commits since ${PREV_TAG}:"
          echo "$COMMIT_LOG" | head -20

          # Build the prompt
          PROMPT="You are a release notes writer for a project called Catalyst (a game server management panel). \
          Given the following git commit messages since the previous release ($PREV_TAG), write release notes for version $NEW_TAG. \
          \
          Format requirements: \
          1. Start with a brief 1-2 sentence narrative summary of what this release delivers. \
          2. Then group changes under emoji-headed categories: \
             - ✨ **Features** — new capabilities \
             - 🐛 **Bug Fixes** — fixes and corrections \
             - 💥 **Breaking Changes** — backwards-incompatible changes \
             - 🔧 **Improvements** — refactors, perf, DX improvements \
             - 📦 **Dependencies** — dependency updates \
             - 🗑️ **Removed** — deprecated features removed \
          3. Only include categories that have relevant changes. \
          4. Rewrite commit messages into user-facing language (not internal jargon). \
          5. Keep it concise — one line per item, no redundant detail. \
          6. Do NOT wrap in markdown code fences. \
          7. Do NOT add a version header — the release title already has it. \
          \
          Commit messages: \
          ${COMMIT_LOG}"

          # Skip API call if no key configured
          if [ "${FALLBACK}" = "true" ]; then
            echo "## Changes\n\n${COMMIT_LOG}" > /tmp/release_notes.md
            echo "⚠️ Wrote fallback commit-log notes (no LLM_API_KEY)"
            exit 0
          fi

          # Call the OpenAI-compatible API
          RESPONSE=$(curl -s -f "${LLM_API_BASE}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(jq -n \
              --arg model "$LLM_MODEL" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [{ role: "user", content: $prompt }],
                temperature: 0.4,
                max_tokens: 1500
              }'
            )" 2>&1) || true

          # Extract the generated text, or fall back to the commit list
          if echo "$RESPONSE" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
            NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
            echo "✅ Successfully generated AI release notes"
          else
            echo "⚠️ AI generation failed, falling back to commit log"
            echo "API response: $(echo "$RESPONSE" | head -5)"
            NOTES="## Changes\n\n${COMMIT_LOG}"
          fi

          # Write notes to file for the next step (handles multiline)
          echo "$NOTES" > /tmp/release_notes.md

      - name: Create GitHub Release
        if: steps.bump.outputs.bump != 'none'
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          body_path: /tmp/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord on Release
        if: steps.bump.outputs.bump != 'none'
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "⊘ No DISCORD_RELEASE_WEBHOOK_URL secret set, skipping notification"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          NOTES=$(cat /tmp/release_notes.md)

          # Truncate notes to fit Discord embed description limit (1024 chars)
          if [ ${#NOTES} -gt 1000 ]; then
            DESCRIPTION="${NOTES:0:1000}…\n[View full release notes](<$RELEASE_URL>)"
          else
            DESCRIPTION="$NOTES"
          fi

          jq -n \
            --arg username "Catalyst" \
            --arg avatar_url "https://github.com/${GITHUB_REPOSITORY_OWNER}.png" \
            --arg title "🚀 Release ${TAG}" \
            --arg description "$DESCRIPTION" \
            --arg url "$RELEASE_URL" \
            --argjson color 5763719 \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                footer: { text: $repo },
                timestamp: now | todateiso8601
              }]
            }' | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_RELEASE_WEBHOOK_URL" -d @-

          echo "✅ Discord release notification sent for ${TAG}"

  # ══════════════════════════════════════════════════════════════════════════════
  # Agent Release Build — builds release agent binaries and uploads them as
  # GitHub Release assets with SHA256 checksums.
  #
  # Lives in auto-version.yml (not ci.yml) because this workflow creates the
  # tag and release. ci.yml can't be triggered by GITHUB_TOKEN tag pushes
  # (GitHub prevents this to avoid infinite loops). Putting agent-release
  # here means it runs in the same workflow that creates the tag — no PAT
  # needed, no cross-workflow trigger required.
  # ══════════════════════════════════════════════════════════════════════════════
  agent-release:
    name: Agent Release Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: blacksmith-2vcpu-ubuntu-2404

    container:
      image: rust:1.93-bookworm

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: catalyst-agent-x86_64-linux-gnu
          - target: x86_64-unknown-linux-musl
            artifact_name: catalyst-agent-x86_64-linux-musl

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/protoc
          key: protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          apt-get update && apt-get install -y unzip ca-certificates
          curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip"
          unzip "protoc-${{ env.PROTOC_VERSION }}-${{ env.PROTOC_ARCH }}.zip" -d /usr/local
          chmod +x /usr/local/bin/protoc

      - name: Install musl tools (for musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: apt-get update && apt-get install -y musl-tools musl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: agent-cargo-deps-${{ hashFiles('catalyst-agent/Cargo.lock') }}
          restore-keys: agent-cargo-deps-

      - name: Cache cargo build (release ${{ matrix.target }})
        uses: actions/cache@v5
        with:
          path: catalyst-agent/target/
          key: agent-release-${{ matrix.target }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-${{ hashFiles('catalyst-agent/src/**') }}
          restore-keys: |
            agent-release-${{ matrix.target }}-${{ hashFiles('catalyst-agent/Cargo.lock') }}-
            agent-release-${{ matrix.target }}-

      - name: Build release
        run: |
          cd catalyst-agent
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for release asset
        run: |
          mv "catalyst-agent/target/${{ matrix.target }}/release/catalyst-agent" "/tmp/${{ matrix.artifact_name }}"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "/tmp/${{ matrix.artifact_name }}" > "/tmp/${{ matrix.artifact_name }}.sha256"

      - name: Upload binary as release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: /tmp/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksum as release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: /tmp/${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

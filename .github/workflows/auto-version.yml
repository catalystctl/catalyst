name: Auto Version

on:
  push:
    branches: [main]
    # Docs-only pushes never change the version (docs commits are excluded
    # from bump analysis), so don't run — or cancel — a release pipeline
    # for them. A no-op run still triggers cancel-in-progress below, which
    # once assassinated the agent builds of an in-flight release.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs-impact.yml'

permissions:
  contents: write
  packages: write
  id-token: write # SLSA provenance + cosign signing
  attestations: write

# New pushes supersede older release pipelines instead of FIFO stacking.
# Each main push fans out to musl agent builds + image builds; without this
# rapid pushes queue obsolete 6-minute builds behind each other.
concurrency:
  group: auto-version-main
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROTOC_VERSION: "25.1"
  REGISTRY: ghcr.io

jobs:
  # Fast path: detect the bump, mutate the version files, commit, tag, push.
  # Everything expensive (agent binaries, images, MCP bundle, install.sh)
  # fans out from this job's outputs and starts as soon as the tag exists.
  #
  # AI release-note generation deliberately does NOT live here: it is a
  # network round-trip to an LLM provider and used to sit in front of the
  # entire build fan-out, so a slow provider (or a retry) delayed every
  # artifact in the release. It now runs in `release-notes` in parallel.
  version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 10

    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      new_version: ${{ steps.version.outputs.new_version }}
      previous_version: ${{ steps.bump.outputs.current_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        run: |
          # Prefer highest semver tag globally (not git-describe ancestry).
          # A concurrent auto-version race can leave a tag on an orphaned
          # release commit while package.json on main already carries that
          # version — describe would then re-bump to the same number.
          HIGHEST_TAG=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1 || true)
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ -z "$HIGHEST_TAG" ]; then
            CURRENT_VERSION="$PKG_VERSION"
            echo "No previous tag found. Using package.json version: $CURRENT_VERSION"
          else
            # max(highest tag, package.json) so we never re-mint an existing version
            CURRENT_VERSION=$(printf '%s\n%s\n' "$HIGHEST_TAG" "$PKG_VERSION" | sort -V | tail -1)
            echo "Highest tag: v$HIGHEST_TAG; package.json: $PKG_VERSION → current=$CURRENT_VERSION"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Commit range for conventional-commit analysis: last ancestor tag if
          # present, else since root. Falls back to last release commit subject.
          ANCESTOR_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$ANCESTOR_TAG" ]; then
            COMMIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            COMMIT_RANGE="${ANCESTOR_TAG}..HEAD"
          fi

          # Analyze commits for bump type
          BUMP="none"

          while IFS= read -r msg || [[ -n "$msg" ]]; do
            [ -z "$msg" ] && continue

            # Dependency overhauls change what every image and binary ships,
            # so chore(deps) must release — treat it as a patch bump. (#266
            # landed as chore(deps) and shipped no artifacts for two days.)
            if echo "$msg" | grep -qE '^chore\(deps\):'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Found chore(deps) in commit: $msg"
              fi
              continue
            fi

            # Skip chore and release commits (never trigger a bump;
            # chore(deps) is handled above and does bump)
            if echo "$msg" | grep -qE '^(chore|ci|build|style)(\([^)]*\))?:'; then
              echo "Skipping chore/ci/build/style commit: $msg"
              continue
            fi

            # Check for breaking changes (minor bump in your scheme)
            if echo "$msg" | grep -qE '^[a-z]+(\([^)]*\))?!:' || \
               echo "$msg" | grep -qiE 'BREAKING CHANGE|BREAKING-CHANGE'; then
              BUMP="minor"
              echo "Found breaking change in commit: $msg"
              break
            fi

            # Check for feat (minor bump)
            if echo "$msg" | grep -qE '^feat(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ] || [ "$BUMP" = "patch" ]; then
                BUMP="minor"
                echo "Found feat in commit: $msg"
              fi
              continue
            fi

            # Check for fix or refactor or perf (patch bump)
            if echo "$msg" | grep -qE '^(fix|refactor|perf|revert)(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Found fix/refactor/perf in commit: $msg"
              fi
              continue
            fi

            # Fallback: any non-chore, non-bot commit that doesn't match conventional
            # format is treated as a patch bump (prevents missed bumps)
            if echo "$msg" | grep -qvE '^(chore|ci|build|style|docs|test)(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Fallback: non-conventional commit triggers patch: $msg"
              fi
            fi
          done < <(git log "$COMMIT_RANGE" --pretty=format:"%s" --)

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump type: $BUMP"

      - name: Bump version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT="${{ steps.bump.outputs.current_version }}"
          BUMP="${{ steps.bump.outputs.bump }}"

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Update package.json files
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Find all package.json files (excluding node_modules)
          mapfile -t FILES < <(find . -name 'package.json' -not -path '*/node_modules/*' -not -path './catalyst-agent/*')

          for file in "${FILES[@]}"; do
            # Skip if not a regular file
            [ -f "$file" ] || continue

            node -e "
              const fs = require('fs');
              const path = '$file';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.version) {
                pkg.version = '$VERSION';
                fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');
                console.log('Updated', path, '→', '$VERSION');
              }
            " 2>/dev/null || true
          done

      - name: Update Cargo.toml
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ -f catalyst-agent/Cargo.toml ]; then
            sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" catalyst-agent/Cargo.toml
            echo "Updated catalyst-agent/Cargo.toml → $VERSION"
          fi

      - name: Commit, tag and push
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): bump version to $VERSION" || true

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping retag (concurrent race or redo)"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
          fi
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════════
  # Agent Release Build — static musl agent binaries as release assets.
  #
  # NATIVE, NOT CROSS: each target builds on a GitHub-hosted runner of its own
  # architecture (x86_64 on ubuntu-latest, aarch64 on ubuntu-24.04-arm). The
  # ARM leg previously cross-compiled from an x86 self-hosted runner with
  # /opt/aarch64-linux-musl-cross; building it on real ARM64 removes the cross
  # toolchain, gives 4 vCPU / 16 GB per leg instead of sharing 3 vCPU / 4 GB
  # self-hosted slots, and keeps release CPU off the machine that serves the
  # production panel and the second runner pool. Hosted public-repo runners are
  # free and the pool is 20 concurrent jobs, so both legs always start at once.
  #
  # This mirrors publish-images, which already builds arm64 natively on
  # ubuntu-24.04-arm for exactly the same reasons.
  #
  # Toolchain is installed per job (Rust target, protoc, sccache) rather than
  # assumed preinstalled — hosted runners start empty, so setup cost is paid
  # every run. sccache still fronts the compile with the shared GHA cache.
  # ══════════════════════════════════════════════════════════════════════════════
  agent-release:
    name: Agent Release Build (${{ matrix.target }})
    permissions:
      contents: write
      id-token: write # SLSA provenance via attest-build-provenance
      attestations: write
      actions: write # sccache GHA cache backend
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: catalyst-agent-x86_64-linux-musl
            runner: ubuntu-latest
            protoc_arch: linux-x86_64
            protoc_sha256: ed8fca87a11c888fed329d6a59c34c7d436165f662a2c875246ddb1ac2b6dd50
            elf_machine: Advanced Micro Devices X86-64
            sccache_arch: x86_64-unknown-linux-musl
            sccache_sha256: 67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
          - target: aarch64-unknown-linux-musl
            artifact_name: catalyst-agent-aarch64-linux-musl
            runner: ubuntu-24.04-arm
            protoc_arch: linux-aarch_64
            protoc_sha256: 99975a8c11b83cd65c3e1151ae1714bf959abc0521acb659bf720524276ab0c8
            elf_machine: AArch64
            sccache_arch: aarch64-unknown-linux-musl
            sccache_sha256: 821a86343191aa1cbab74bd42f9e93c9a63bf85e4742945f40d3ae84193c1c77

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # ── Install protoc (the agent's protobuf build dependency) ──
      # Self-hosted images shipped protoc preinstalled; hosted runners do not,
      # so download the release matching this runner's architecture and verify
      # it against the digest pinned in the matrix.
      - name: Cache protoc
        id: cache-protoc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/protoc
            ~/.local/include/google
          key: protoc-${{ env.PROTOC_VERSION }}-${{ matrix.protoc_arch }}

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin ~/.local/include
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VERSION }}/protoc-${{ env.PROTOC_VERSION }}-${{ matrix.protoc_arch }}.zip"
          echo "${{ matrix.protoc_sha256 }}  /tmp/protoc.zip" | sha256sum -c -
          unzip -q /tmp/protoc.zip -d ~/.local
          rm -f /tmp/protoc.zip
          chmod +x ~/.local/bin/protoc

      - name: Add protoc to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/protoc" --version

      # ── Install sccache ──
      # Cached across runs because the tarball is large relative to the rest of
      # setup. Same version as the self-hosted runner image.
      - name: Cache sccache
        id: cache-sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/sccache
          key: sccache-0.17.0-${{ matrix.sccache_arch }}

      - name: Install sccache
        if: steps.cache-sccache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL -o /tmp/sccache.tgz "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-${{ matrix.sccache_arch }}.tar.gz"
          echo "${{ matrix.sccache_sha256 }}  /tmp/sccache.tgz" | sha256sum -c -
          tar -xzf /tmp/sccache.tgz -C /tmp
          install -m755 "/tmp/sccache-v0.17.0-${{ matrix.sccache_arch }}/sccache" ~/.local/bin/sccache
          rm -rf /tmp/sccache.tgz "/tmp/sccache-v0.17.0-${{ matrix.sccache_arch }}"

      - name: Add sccache to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # sccache's GHA backend needs ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN
      # as env vars. They are injected into *action* processes, not into plain
      # `run` steps, so they must be re-exported explicitly — this is documented
      # as a required part of the setup (mozilla/sccache docs/GHA.md), not a
      # self-hosted-only workaround. Without it the GHA backend has no
      # credentials and every build recompiles from scratch.
      - name: Export GHA cache credentials for sccache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ── Configure Rust build caching ──
      # The GHA backend is what carries cache hits across the ephemeral hosted
      # runners: without it every release recompiles all crates from scratch.
      # SCCACHE_GHA_VERSION is the remote purge switch — bump it to invalidate.
      - name: Configure Rust build caching
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_GHA_ENABLED=on"
            echo "SCCACHE_GHA_VERSION=1"
            echo "SCCACHE_CACHE_SIZE=10G"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "$GITHUB_ENV"
          sccache --version

      # ── Install musl toolchain ──
      # The agent links native deps (ring, etc.) into a *-musl target, so the
      # musl compiler must be present. The self-hosted runner image preinstalled
      # musl-tools/musl-dev; GitHub-hosted runners do not. Each job runs natively
      # on its target architecture, so the x86_64 toolchain is the correct one
      # for both legs — the old aarch64 cross-compiler is gone.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev
          musl-gcc --version

      # cc-rs (used by ring and other native deps) picks the compiler from the
      # CC_<target> / CARGO_TARGET_<TARGET>_LINKER vars. Point them at musl-gcc
      # explicitly rather than relying on cargo's target inference.
      - name: Point the musl target at musl-gcc
        run: |
          TARGET="${{ matrix.target }}"
          TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo "CC_${TARGET}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "Configured musl-gcc for $TARGET"

      - name: Build release
        run: |
          cd catalyst-agent
          cargo build --release --target ${{ matrix.target }}

      - name: Show sccache stats
        run: sccache --show-stats || true

      - name: Rename binary for release asset
        run: |
          mv "catalyst-agent/target/${{ matrix.target }}/release/catalyst-agent" "/tmp/${{ matrix.artifact_name }}"

      - name: Verify musl binary is statically linked
        shell: bash
        run: |
          set -euo pipefail
          BIN="/tmp/${{ matrix.artifact_name }}"
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "ERROR: ${{ matrix.artifact_name }} is dynamically linked (has PT_INTERP)"
            readelf -d "$BIN" || true
            exit 1
          fi
          # Guard the native-build switch: an artifact built for the wrong
          # architecture would still be statically linked and would only fail
          # on a customer's node, so assert the ELF machine matches the matrix.
          MACHINE=$(readelf -h "$BIN" | awk -F: '/Machine:/ {gsub(/^ +/,"",$2); print $2}')
          echo "ELF machine: $MACHINE"
          if [ "$MACHINE" != "${{ matrix.elf_machine }}" ]; then
            echo "ERROR: expected ELF machine '${{ matrix.elf_machine }}', got '$MACHINE'"
            exit 1
          fi
          echo "OK: ${{ matrix.artifact_name }} is static $MACHINE"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "/tmp/${{ matrix.artifact_name }}" > "/tmp/${{ matrix.artifact_name }}.sha256"
          cat "/tmp/${{ matrix.artifact_name }}.sha256"

      - name: Attest binary provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/${{ matrix.artifact_name }}

      - name: Upload binary + checksum as release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: |
            /tmp/${{ matrix.artifact_name }}
            /tmp/${{ matrix.artifact_name }}.sha256
          # Uploads update the existing release and softprops defaults `draft`
          # to false, which would publish it here — before images exist. Only
          # publish-release may publish.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════════
  # Release notes + draft release.
  #
  # Split out of `version` on purpose. This job is a network round-trip to an
  # LLM provider that used to run before the build fan-out, so a slow or
  # retrying provider delayed every artifact in the release even though none of
  # them depend on the notes. It now runs in PARALLEL with agent-release,
  # publish-images, mcp-release and publish-install-script.
  #
  # It owns creating the draft release, which the asset jobs then upload into.
  # softprops/action-gh-release creates the release when absent and updates it
  # when present, so the jobs are safe to race; `draft: true` everywhere keeps
  # the release unpublished until publish-release succeeds.
  # ══════════════════════════════════════════════════════════════════════════════
  release-notes:
    name: Generate Release Notes
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.new_version }}
          fetch-depth: 0

      - name: Generate AI Release Notes
        id: release_notes
        env:
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_version }}
        run: |
          FALLBACK=false
          if [ -z "$LLM_API_KEY" ]; then
            echo "❌ LLM_API_KEY secret is not set — cannot generate AI release notes"
            echo "   Add it in Settings → Secrets and variables → Actions"
            FALLBACK=true
          fi

          PREV_TAG="v${PREVIOUS_TAG}"
          NEW_TAG="v${NEW_VERSION}"

          # Gather the commit log between the previous tag and HEAD
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          else
            COMMIT_LOG=$(git log --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          fi

          # If no commits were found, fall back to auto-generated notes
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="- No commit messages available"
          fi

          # Truncate if too long (keep within reasonable prompt size)
          COMMIT_LOG=$(echo "$COMMIT_LOG" | head -200)

          echo "Generating release notes for ${NEW_TAG}..."
          echo "Commits since ${PREV_TAG}:"
          echo "$COMMIT_LOG" | head -20

          # Build the prompt
          PROMPT="You are a release notes writer for a project called Catalyst (a game server management panel). \
          Given the following git commit messages since the previous release ($PREV_TAG), write release notes for version $NEW_TAG. \
          \
          Format requirements: \
          1. Start with a brief 1-2 sentence narrative summary of what this release delivers. \
          2. Then group changes under emoji-headed categories: \
             - ✨ **Features** — new capabilities \
             - 🐛 **Bug Fixes** — fixes and corrections \
             - 💥 **Breaking Changes** — backwards-incompatible changes \
             - 🔧 **Improvements** — refactors, perf, DX improvements \
             - 📦 **Dependencies** — dependency updates \
             - 🗑️ **Removed** — deprecated features removed \
          3. Only include categories that have relevant changes. \
          4. Rewrite commit messages into user-facing language (not internal jargon). \
          5. Keep it concise — one line per item, no redundant detail. \
          6. Do NOT wrap in markdown code fences. \
          7. Do NOT add a version header — the release title already has it. \
          \
          Commit messages: \
          ${COMMIT_LOG}"

          # Skip API call if no key configured
          if [ "${FALLBACK}" = "true" ]; then
            printf '## Changes\n\n%s\n' "${COMMIT_LOG}" > /tmp/release_notes.md
            echo "⚠️ Wrote fallback commit-log notes (no LLM_API_KEY)"
            exit 0
          fi

          # Call the OpenAI-compatible API
          RESPONSE=$(curl -s -f "${LLM_API_BASE}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(jq -n \
              --arg model "$LLM_MODEL" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [{ role: "user", content: $prompt }],
                temperature: 0.4,
                max_tokens: 1500
              }'
            )" 2>&1) || true

          # Extract the generated text, or fall back to the commit list
          if echo "$RESPONSE" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
            NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
            echo "✅ Successfully generated AI release notes"
          else
            echo "⚠️ AI generation failed, falling back to commit log"
            echo "API response: $(echo "$RESPONSE" | head -5)"
            printf '## Changes\n\n%s\n' "${COMMIT_LOG}" > /tmp/release_notes.md
            exit 0
          fi

          # Write notes to file for the next step (handles multiline)
          printf '%s\n' "$NOTES" > /tmp/release_notes.md

      # Created as a DRAFT: the panel update check, agent self-update, and
      # `docker compose pull` all key off the published release, while the
      # agent binaries (agent-release) and container images (publish-images)
      # take many more minutes to build. Publishing immediately would notify
      # every panel of an update whose artifacts don't exist yet. The
      # publish-release job below flips this to published once everything
      # it needs is live.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          name: v${{ needs.version.outputs.new_version }}
          body_path: /tmp/release_notes.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the versioned install.sh + checksum the docs point at, so the
  # `curl -o install.sh && sha256sum -c` flow always has matching artifacts.
  publish-install-script:
    name: Publish Install Script
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write # SLSA provenance via attest-build-provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Generate install.sh checksum
        run: |
          sha256sum install.sh > /tmp/install.sh.sha256
          cat /tmp/install.sh.sha256

      - name: Attest install.sh provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: install.sh

      - name: Upload install.sh + checksum as release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: |
            install.sh
            /tmp/install.sh.sha256
          draft: true # see agent-release: uploads must not publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # MCP server: single-file Node bundle, no npm registry needed. Users
  # download catalyst-mcp.mjs from the release and point their MCP client
  # at it (Node 20+ only). Built here so every version tag ships one.
  mcp-release:
    name: Publish MCP Server Bundle
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write # SLSA provenance via attest-build-provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build MCP bundle
        run: pnpm --filter @catalyst/mcp-server run build:bundle

      - name: Stage release asset
        run: |
          cp packages/mcp-server/dist/catalyst-mcp.mjs /tmp/catalyst-mcp.mjs
          chmod +x /tmp/catalyst-mcp.mjs
          sha256sum /tmp/catalyst-mcp.mjs > /tmp/catalyst-mcp.mjs.sha256
          cat /tmp/catalyst-mcp.mjs.sha256

      - name: Attest bundle provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/catalyst-mcp.mjs

      - name: Upload bundle + checksum as release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: |
            /tmp/catalyst-mcp.mjs
            /tmp/catalyst-mcp.mjs.sha256
          draft: true # see agent-release: uploads must not publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lockstep image publish: a version bump always rebuilds backend AND frontend
  # from the tagged commit so baked-in versions match the agent binaries.
  # ci.yml cannot do this on main — GITHUB_TOKEN chore(release) commits do not
  # retrigger workflows.
  #
  # MULTI-ARCH: each image is built as one single-platform leg per architecture
  # (natively — no QEMU), pushed by DIGEST, and then assembled into a manifest
  # list by the merge-images job below. amd64 runs on ubuntu-latest; arm64 runs
  # on GitHub's hosted ubuntu-24.04-arm runners (GA in all repositories since
  # 2026-01; free and 4 vCPU on public repos).
  #
  # Why per-arch legs instead of one buildx call with two platforms: emulated
  # arm64 builds of the pnpm/Node layers cost far more wall-clock than native
  # ones, and a single job would serialise both arches. Native legs also give
  # per-arch GHA layer caches that actually hit on subsequent releases.
  #
  # CRITICAL: these legs must NEVER push by tag. Two legs pushing `:latest`
  # would race and the second would clobber the first, silently leaving the
  # tag pointing at a single-arch manifest. `outputs: type=image,push-by-digest`
  # keeps each arch addressable by digest until merge-images retags them.
  publish-images:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      actions: write # Buildx GHA layer cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: catalyst-backend/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: backend
            file: catalyst-backend/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: frontend
            file: catalyst-frontend/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: frontend
            file: catalyst-frontend/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.new_version }}

      # catalyst-frontend/Dockerfile COPYs catalyst-plugins/ (embedded plugin
      # frontends) — the plugins live in their own repo, not in this checkout.
      - name: Checkout plugins repository
        if: matrix.image == 'frontend'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: catalystctl/catalyst-plugins
          ref: e3d2e3ee786e19bb40ecf5a565638e3f6db7c186 # pinned main 2026-09-18 (discord-oauth 1.0.1)
          path: catalyst-plugins

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=raw,value=v${{ needs.version.outputs.new_version }}
            type=sha,prefix=

      # push-by-digest: the tag list above is NOT applied here. Both arches are
      # pushed untagged and re-tagged by merge-images, so neither leg can
      # overwrite the other's tag. Output digest is the merge job's input.
      - name: Build and push by digest
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-arch digests into one multi-arch manifest list and applies
  # the real tags. Runs once per image. The tags set here are what customers
  # pull — until this succeeds, the published tags still point at the PREVIOUS
  # release, which is the desired fail-safe: a half-built release never gets
  # served as :latest.
  merge-images:
    name: Merge ${{ matrix.image }} manifest
    needs: [version, publish-images]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # SLSA provenance via attest-build-provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
          - image: frontend

    steps:
      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=raw,value=v${{ needs.version.outputs.new_version }}
            type=sha,prefix=

      - name: Create manifest list and push
        id: merge
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # Exactly one digest per architecture must be present. A missing leg
          # would otherwise silently publish a single-arch image — the exact
          # bug this job exists to fix. Digests are bare 64-char hex filenames.
          mapfile -t digests < <(find . -maxdepth 1 -type f -name '[0-9a-f]*' -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "ERROR: expected 2 arch digests for ${{ matrix.image }}, found ${#digests[@]}"
            printf '%s\n' "${digests[@]}"
            exit 1
          fi
          # Build the source refs and the tag flags as arrays so nothing is
          # re-split by the shell (SC2046 / SC2086).
          srcs=()
          for d in "${digests[@]}"; do
            srcs+=("${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}@sha256:${d}")
          done
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_flags=()
          for t in "${tags[@]}"; do
            tag_flags+=("-t" "$t")
          done
          docker buildx imagetools create "${tag_flags[@]}" "${srcs[@]}"
          # Capture the digest of the manifest list we just published — this is
          # what provenance must be attested against (not a per-arch digest).
          digest="$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}:latest \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}:latest

      - name: Attest image provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attested against the manifest list digest, so provenance covers the
          # multi-arch index rather than a single architecture.
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  # ══════════════════════════════════════════════════════════════════════════════
  # Publish the draft release created by the release-notes job. Runs only after
  # the agent binaries, the MCP bundle, AND both container images are live. Until this flips the
  # draft to published, `releases/latest` keeps serving the previous version,
  # so panels don't notify (and can't pull) an update whose artifacts don't
  # exist yet. If any build job fails this is skipped and the release stays
  # a draft — announce nothing rather than a broken update.
  #
  # release-notes is a dependency because it is what creates the draft: without
  # it `gh release edit` would have no release to publish.
  # ══════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [version, agent-release, publish-install-script, mcp-release, merge-images, release-notes]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --repo is required: this job has no checkout, so gh can't discover
          # the repository from git and fails with "not a git repository".
          gh release edit "v${{ needs.version.outputs.new_version }}" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "✅ Release v${{ needs.version.outputs.new_version }} published"

      - name: Notify Discord on Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "⊘ No DISCORD_RELEASE_WEBHOOK_URL secret set, skipping notification"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)

          # Truncate notes to fit Discord embed description limit (1024 chars)
          if [ ${#NOTES} -gt 1000 ]; then
            DESCRIPTION="${NOTES:0:1000}…\n[View full release notes](<$RELEASE_URL>)"
          else
            DESCRIPTION="$NOTES"
          fi

          jq -n \
            --arg username "Catalyst" \
            --arg avatar_url "https://github.com/${GITHUB_REPOSITORY_OWNER}.png" \
            --arg title "🚀 Release ${TAG}" \
            --arg description "$DESCRIPTION" \
            --arg url "$RELEASE_URL" \
            --argjson color 5763719 \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                footer: { text: $repo },
                timestamp: now | todateiso8601
              }]
            }' | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_RELEASE_WEBHOOK_URL" -d @-

          echo "✅ Discord release notification sent for ${TAG}"

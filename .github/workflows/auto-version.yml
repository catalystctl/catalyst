name: Auto Version

on:
  push:
    branches: [main]
    # Docs-only pushes never change the version (docs commits are excluded
    # from bump analysis), so don't run — or cancel — a release pipeline
    # for them. A no-op run still triggers cancel-in-progress below, which
    # once assassinated the agent builds of an in-flight release.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs-impact.yml'

permissions:
  contents: write
  packages: write
  id-token: write # SLSA provenance + cosign signing
  attestations: write

# New pushes supersede older release pipelines instead of FIFO stacking.
# Each main push fans out to musl agent builds + image builds; without this
# rapid pushes queue obsolete 6-minute builds behind each other.
concurrency:
  group: auto-version-main
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROTOC_VERSION: "25.1"
  PROTOC_ARCH: "linux-x86_64"
  REGISTRY: ghcr.io

jobs:
  version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump
        id: bump
        run: |
          # Prefer highest semver tag globally (not git-describe ancestry).
          # A concurrent auto-version race can leave a tag on an orphaned
          # release commit while package.json on main already carries that
          # version — describe would then re-bump to the same number.
          HIGHEST_TAG=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1 || true)
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ -z "$HIGHEST_TAG" ]; then
            CURRENT_VERSION="$PKG_VERSION"
            echo "No previous tag found. Using package.json version: $CURRENT_VERSION"
          else
            # max(highest tag, package.json) so we never re-mint an existing version
            CURRENT_VERSION=$(printf '%s\n%s\n' "$HIGHEST_TAG" "$PKG_VERSION" | sort -V | tail -1)
            echo "Highest tag: v$HIGHEST_TAG; package.json: $PKG_VERSION → current=$CURRENT_VERSION"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Commit range for conventional-commit analysis: last ancestor tag if
          # present, else since root. Falls back to last release commit subject.
          ANCESTOR_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$ANCESTOR_TAG" ]; then
            COMMIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            COMMIT_RANGE="${ANCESTOR_TAG}..HEAD"
          fi

          # Analyze commits for bump type
          BUMP="none"

          while IFS= read -r msg || [[ -n "$msg" ]]; do
            [ -z "$msg" ] && continue

            # Skip chore and release commits (never trigger a bump)
            if echo "$msg" | grep -qE '^(chore|ci|build|style)(\([^)]*\))?:'; then
              echo "Skipping chore/ci/build/style commit: $msg"
              continue
            fi

            # Check for breaking changes (minor bump in your scheme)
            if echo "$msg" | grep -qE '^[a-z]+(\([^)]*\))?!:' || \
               echo "$msg" | grep -qiE 'BREAKING CHANGE|BREAKING-CHANGE'; then
              BUMP="minor"
              echo "Found breaking change in commit: $msg"
              break
            fi

            # Check for feat (minor bump)
            if echo "$msg" | grep -qE '^feat(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ] || [ "$BUMP" = "patch" ]; then
                BUMP="minor"
                echo "Found feat in commit: $msg"
              fi
              continue
            fi

            # Check for fix or refactor or perf (patch bump)
            if echo "$msg" | grep -qE '^(fix|refactor|perf|revert)(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Found fix/refactor/perf in commit: $msg"
              fi
              continue
            fi

            # Fallback: any non-chore, non-bot commit that doesn't match conventional
            # format is treated as a patch bump (prevents missed bumps)
            if echo "$msg" | grep -qvE '^(chore|ci|build|style|docs|test)(\([^)]*\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "Fallback: non-conventional commit triggers patch: $msg"
              fi
            fi
          done < <(git log "$COMMIT_RANGE" --pretty=format:"%s" --)

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump type: $BUMP"

      - name: Bump version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          CURRENT="${{ steps.bump.outputs.current_version }}"
          BUMP="${{ steps.bump.outputs.bump }}"

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Update package.json files
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Find all package.json files (excluding node_modules)
          mapfile -t FILES < <(find . -name 'package.json' -not -path '*/node_modules/*' -not -path './catalyst-agent/*')

          for file in "${FILES[@]}"; do
            # Skip if not a regular file
            [ -f "$file" ] || continue

            node -e "
              const fs = require('fs');
              const path = '$file';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.version) {
                pkg.version = '$VERSION';
                fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');
                console.log('Updated', path, '→', '$VERSION');
              }
            " 2>/dev/null || true
          done

      - name: Update Cargo.toml
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ -f catalyst-agent/Cargo.toml ]; then
            sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" catalyst-agent/Cargo.toml
            echo "Updated catalyst-agent/Cargo.toml → $VERSION"
          fi

      - name: Commit, tag and push
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): bump version to $VERSION" || true

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping retag (concurrent race or redo)"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
          fi
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI Release Notes
        id: release_notes
        if: steps.bump.outputs.bump != 'none'
        env:
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.bump.outputs.current_version }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "❌ LLM_API_KEY secret is not set — cannot generate AI release notes"
            echo "   Add it in Settings → Secrets and variables → Actions"
            echo "FALLBACK=true" >> "$GITHUB_OUTPUT"
          fi

          PREV_TAG="v${PREVIOUS_TAG}"
          NEW_TAG="v${NEW_VERSION}"

          # Gather the commit log between the previous tag and HEAD
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          else
            COMMIT_LOG=$(git log --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- No commits found")
          fi

          # If no commits were found, fall back to auto-generated notes
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="- No commit messages available"
          fi

          # Truncate if too long (keep within reasonable prompt size)
          COMMIT_LOG=$(echo "$COMMIT_LOG" | head -200)

          echo "Generating release notes for ${NEW_TAG}..."
          echo "Commits since ${PREV_TAG}:"
          echo "$COMMIT_LOG" | head -20

          # Build the prompt
          PROMPT="You are a release notes writer for a project called Catalyst (a game server management panel). \
          Given the following git commit messages since the previous release ($PREV_TAG), write release notes for version $NEW_TAG. \
          \
          Format requirements: \
          1. Start with a brief 1-2 sentence narrative summary of what this release delivers. \
          2. Then group changes under emoji-headed categories: \
             - ✨ **Features** — new capabilities \
             - 🐛 **Bug Fixes** — fixes and corrections \
             - 💥 **Breaking Changes** — backwards-incompatible changes \
             - 🔧 **Improvements** — refactors, perf, DX improvements \
             - 📦 **Dependencies** — dependency updates \
             - 🗑️ **Removed** — deprecated features removed \
          3. Only include categories that have relevant changes. \
          4. Rewrite commit messages into user-facing language (not internal jargon). \
          5. Keep it concise — one line per item, no redundant detail. \
          6. Do NOT wrap in markdown code fences. \
          7. Do NOT add a version header — the release title already has it. \
          \
          Commit messages: \
          ${COMMIT_LOG}"

          # Skip API call if no key configured
          if [ "${FALLBACK}" = "true" ]; then
            echo "## Changes\n\n${COMMIT_LOG}" > /tmp/release_notes.md
            echo "⚠️ Wrote fallback commit-log notes (no LLM_API_KEY)"
            exit 0
          fi

          # Call the OpenAI-compatible API
          RESPONSE=$(curl -s -f "${LLM_API_BASE}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(jq -n \
              --arg model "$LLM_MODEL" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [{ role: "user", content: $prompt }],
                temperature: 0.4,
                max_tokens: 1500
              }'
            )" 2>&1) || true

          # Extract the generated text, or fall back to the commit list
          if echo "$RESPONSE" | jq -e '.choices[0].message.content' >/dev/null 2>&1; then
            NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
            echo "✅ Successfully generated AI release notes"
          else
            echo "⚠️ AI generation failed, falling back to commit log"
            echo "API response: $(echo "$RESPONSE" | head -5)"
            NOTES="## Changes\n\n${COMMIT_LOG}"
          fi

          # Write notes to file for the next step (handles multiline)
          echo "$NOTES" > /tmp/release_notes.md

      # Created as a DRAFT: the panel update check, agent self-update, and
      # `docker compose pull` all key off the published release, while the
      # agent binaries (agent-release) and container images (publish-images)
      # take many more minutes to build. Publishing immediately would notify
      # every panel of an update whose artifacts don't exist yet. The
      # publish-release job below flips this to published once everything
      # it needs is live.
      - name: Create GitHub Release
        if: steps.bump.outputs.bump != 'none'
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          body_path: /tmp/release_notes.md
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════════
  # Agent Release Build — builds static musl agent binaries and uploads them
  # as GitHub Release assets with SHA256 checksums.
  #
  # Musl only: deploy-agent.sh, the agent self-updater, and the backend
  # download proxy all fetch catalyst-agent-{arch}-linux-musl. The gnu
  # targets were unused (the agent Docker image compiles gnu from source),
  # so they were dropped to halve compile load and fit the runner pool.
  #
  # Lives in auto-version.yml (not ci.yml) because this workflow creates the
  # tag and release. ci.yml can't be triggered by GITHUB_TOKEN tag pushes
  # (GitHub prevents this to avoid infinite loops). Putting agent-release
  # here means it runs in the same workflow that creates the tag — no PAT
  # needed, no cross-workflow trigger required.
  # ══════════════════════════════════════════════════════════════════════════════
  agent-release:
    name: Agent Release Build (${{ matrix.target }})
    permissions:
      contents: write
      id-token: write # SLSA provenance via attest-build-provenance
      attestations: write
      actions: write # sccache GHA cache backend
    needs: version
    if: needs.version.outputs.bump != 'none'
    # Push-to-main only (trusted), so self-hosted directly. Runs natively on
    # the runner image (Rust + cross linkers + protoc preinstalled) instead of
    # a rust container — self-hosted runners have no Docker daemon for
    # container: jobs.
    runs-on: [self-hosted, Linux, X64, catalyst-ci]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: catalyst-agent-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            artifact_name: catalyst-agent-aarch64-linux-musl

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Check protoc
        shell: bash
        run: |
          set -euo pipefail
          # Runner image preinstalls protoc 25.1; fail fast if it drifted.
          if command -v protoc >/dev/null 2>&1 && [ "$(protoc --version)" = "libprotoc ${{ env.PROTOC_VERSION }}" ]; then
            echo "protoc ${{ env.PROTOC_VERSION }} already installed"
            exit 0
          fi
          echo "ERROR: protoc ${{ env.PROTOC_VERSION }} missing from runner image — rebuild infra/self-hosted-runners"
          exit 1

      - name: Install target linkers
        shell: bash
        run: |
          set -euo pipefail
          # Musl link toolchains are preinstalled in the runner image.
          # Fail fast if the image drifted instead of apt-installing mid-release.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              command -v musl-gcc >/dev/null 2>&1 || { echo "ERROR: musl-gcc missing from runner image"; exit 1; }
              ;;
            aarch64-unknown-linux-musl)
              [ -x /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc ] || { echo "ERROR: aarch64 musl cross toolchain missing"; exit 1; }
              echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
              echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown target ${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # sccache GHA backend needs these tokens as env vars on self-hosted
      # runners (GitHub-hosted exposes them automatically).
      - name: Export GHA cache credentials for sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Disk cache (per-slot /cache volume) + shared GHA cache backend.
      # Disk covers repeat builds on the same slot with zero network cost;
      # GHA shares hits across slots so a target compiled on slot 0 helps
      # slot 3. Bump SCCACHE_GHA_VERSION to purge the shared cache.
      - name: Configure Rust build caching
        # sccache is guarded (not job env) so the workflow also works on
        # images predating it: without it the build just compiles directly.
        run: |
          # Incremental builds are incompatible with sccache; CI never uses
          # them (the removed cache action used to set this).
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          if command -v sccache >/dev/null 2>&1; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_DIR=/cache/sccache"
              echo "SCCACHE_CACHE_SIZE=10G"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
              echo "SCCACHE_GHA_ENABLED=on"
              echo "SCCACHE_GHA_VERSION=1"
            } >> "$GITHUB_ENV"
            mkdir -p /cache/sccache
            echo "sccache enabled (disk + GHA shared)"
          else
            echo "sccache not installed, compiling directly"
          fi

      - name: Build release
        run: |
          cd catalyst-agent
          cargo build --release --target ${{ matrix.target }}

      - name: Show sccache stats
        run: sccache --show-stats || true

      - name: Rename binary for release asset
        run: |
          mv "catalyst-agent/target/${{ matrix.target }}/release/catalyst-agent" "/tmp/${{ matrix.artifact_name }}"

      - name: Verify musl binary is statically linked
        shell: bash
        run: |
          set -euo pipefail
          BIN="/tmp/${{ matrix.artifact_name }}"
          # binutils is preinstalled in the runner image; no apt mid-release.
          if readelf -l "$BIN" | grep -q 'INTERP'; then
            echo "ERROR: ${{ matrix.artifact_name }} is dynamically linked (has PT_INTERP)"
            readelf -d "$BIN" || true
            exit 1
          fi
          echo "OK: ${{ matrix.artifact_name }} is statically linked (no PT_INTERP)"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "/tmp/${{ matrix.artifact_name }}" > "/tmp/${{ matrix.artifact_name }}.sha256"

      - name: Attest binary provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: /tmp/${{ matrix.artifact_name }}

      - name: Upload binary + checksum as release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: |
            /tmp/${{ matrix.artifact_name }}
            /tmp/${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the versioned install.sh + checksum the docs point at, so the
  # `curl -o install.sh && sha256sum -c` flow always has matching artifacts.
  publish-install-script:
    name: Publish Install Script
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write # SLSA provenance via attest-build-provenance

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Generate install.sh checksum
        run: |
          sha256sum install.sh > /tmp/install.sh.sha256
          cat /tmp/install.sh.sha256

      - name: Attest install.sh provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: install.sh

      - name: Upload install.sh + checksum as release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: |
            install.sh
            /tmp/install.sh.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # MCP server: single-file Node bundle, no npm registry needed. Users
  # download catalyst-mcp.mjs from the release and point their MCP client
  # at it (Node 20+ only). Built here so every version tag ships one.
  mcp-release:
    name: Publish MCP Server Bundle
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write # SLSA provenance via attest-build-provenance

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build MCP bundle
        run: pnpm --filter @catalyst/mcp-server run build:bundle

      - name: Stage release asset
        run: |
          cp packages/mcp-server/dist/catalyst-mcp.mjs /tmp/catalyst-mcp.mjs
          chmod +x /tmp/catalyst-mcp.mjs
          sha256sum /tmp/catalyst-mcp.mjs > /tmp/catalyst-mcp.mjs.sha256
          cat /tmp/catalyst-mcp.mjs.sha256

      - name: Attest bundle provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: /tmp/catalyst-mcp.mjs

      - name: Upload bundle + checksum as release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          files: |
            /tmp/catalyst-mcp.mjs
            /tmp/catalyst-mcp.mjs.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lockstep image publish: a version bump always rebuilds backend AND frontend
  # from the tagged commit so baked-in versions match the agent binaries.
  # ci.yml cannot do this on main — GITHUB_TOKEN chore(release) commits do not
  # retrigger workflows.
  #
  # Runs on GitHub-hosted ubuntu-latest with Docker Buildx + GHA layer cache:
  # overlayfs + warm pnpm layers beat self-hosted buildah/vfs cold builds,
  # and it frees the self-hosted pool for the musl agent compiles.
  publish-images:
    name: Publish ${{ matrix.image }} Image
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write # SLSA provenance via attest-build-provenance
      attestations: write
      actions: write # Buildx GHA layer cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: catalyst-backend/Dockerfile
          - image: frontend
            file: catalyst-frontend/Dockerfile

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ needs.version.outputs.new_version }}

      # catalyst-frontend/Dockerfile COPYs catalyst-plugins/ (embedded plugin
      # frontends) — the plugins live in their own repo, not in this checkout.
      - name: Checkout plugins repository
        if: matrix.image == 'frontend'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: catalystctl/catalyst-plugins
          ref: 4e735b0411a67e54a38e9fdf5fb85e4ec55ff569 # pinned main 2026-09-10
          path: catalyst-plugins

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=raw,value=v${{ needs.version.outputs.new_version }}
            type=sha,prefix=

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance (SLSA/Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/catalyst-${{ matrix.image }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

  # ══════════════════════════════════════════════════════════════════════════════
  # Publish the draft release created by the version job. Runs only after the
  # agent binaries, the MCP bundle, AND both container images are live. Until this flips the
  # draft to published, `releases/latest` keeps serving the previous version,
  # so panels don't notify (and can't pull) an update whose artifacts don't
  # exist yet. If any build job fails this is skipped and the release stays
  # a draft — announce nothing rather than a broken update.
  # ══════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [version, agent-release, publish-install-script, mcp-release, publish-images]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --repo is required: this job has no checkout, so gh can't discover
          # the repository from git and fails with "not a git repository".
          gh release edit "v${{ needs.version.outputs.new_version }}" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "✅ Release v${{ needs.version.outputs.new_version }} published"

      - name: Notify Discord on Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "⊘ No DISCORD_RELEASE_WEBHOOK_URL secret set, skipping notification"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)

          # Truncate notes to fit Discord embed description limit (1024 chars)
          if [ ${#NOTES} -gt 1000 ]; then
            DESCRIPTION="${NOTES:0:1000}…\n[View full release notes](<$RELEASE_URL>)"
          else
            DESCRIPTION="$NOTES"
          fi

          jq -n \
            --arg username "Catalyst" \
            --arg avatar_url "https://github.com/${GITHUB_REPOSITORY_OWNER}.png" \
            --arg title "🚀 Release ${TAG}" \
            --arg description "$DESCRIPTION" \
            --arg url "$RELEASE_URL" \
            --argjson color 5763719 \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                footer: { text: $repo },
                timestamp: now | todateiso8601
              }]
            }' | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_RELEASE_WEBHOOK_URL" -d @-

          echo "✅ Discord release notification sent for ${TAG}"

# Preserve X-Forwarded-Proto from upstream reverse proxy (Caddy, Traefik).
# When no upstream proxy is present, fall back to the actual connection scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

# Add HSTS header only when behind a TLS-terminating reverse proxy.
map $http_x_forwarded_proto $hsts_header_value {
    https "max-age=63072000; includeSubDomains; preload";
    default "";
}

# Trust client IP from the compose-internal reverse proxy ONLY. Caddy/Traefik
# overlays prepend the real client address to X-Forwarded-For; without these
# directives $remote_addr below would collapse every visitor into the proxy
# container IP (shared rate-limit bucket, no audit attribution). External
# clients cannot reach nginx directly except through the proxy, so trusting
# the private network is spoofing-resistant.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (applied to all responses)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Origin-Agent-Cluster ?1 always;

    # HSTS — only when behind a TLS-terminating reverse proxy
    add_header Strict-Transport-Security $hsts_header_value always;

    # CSP for the SPA shell. script-src 'self' blocks injected inline/external
    # scripts; style-src allows inline styles because the admin branding
    # feature injects a <style> element with custom CSS at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Gzip compression — fallback when Brotli module unavailable
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2;

    # Static asset caching — JS/CSS have content hashes in filenames
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 6m;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML — no cache (always fresh, prevents stale content)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Streaming / SSE endpoints ──────────────────────────────────────────
    # These must use proxy_buffering off so chunks are forwarded immediately.
    # No gzip — SSE and file streams must not be compressed by the proxy.
    # NOTE: nginx matches locations by most-specific prefix first, so these
    # longer prefixes take priority over the general /api/ catch-all below.

    # Deploy endpoint — strip security headers that break plain HTTP
    # (CSP upgrade-insecure-requests, COOP, HSTS cause browser to rewrite to https://)
    location /api/deploy/ {
        # Suppress HSTS for deploy endpoint (curl compatibility)
        add_header Strict-Transport-Security "" always;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Origin-Agent-Cluster;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Download-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_hide_header X-DNS-Prefetch-Control;

        gzip off;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Admin SSE event stream
    location /api/admin/events/stream {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        gzip off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Server console SSE stream
    location ~ ^/api/servers/[^/]+/console$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        gzip off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Server metrics SSE stream
    location ~ ^/api/servers/[^/]+/metrics/stream$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        gzip off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backup download (large file stream)
    location ~ ^/api/backups/[^/]+/download$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        gzip off;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # File browser upload/download — stream through, 8h idle budget for 100GB.
    location ~ ^/api/servers/[^/]+/files/(upload|download)$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        client_max_body_size 0;
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 28800s;
        proxy_read_timeout 28800s;
        proxy_intercept_errors off;
    }

    # ── General API proxy ──────────────────────────────────────────────────
    # With ENABLE_COMPRESSION=false in the backend, Fastify no longer
    # compresses responses.  nginx can now safely gzip API JSON and buffer
    # the full response before forwarding — this eliminates the "premature
    # close" stream truncation that occurred when @fastify/compress's
    # gzip stream was cut off before flushing its final bytes.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Unlimited here — the panel max-upload setting is the real gate
        # (Fastify + agents). A second nginx cap silently 413s first.
        client_max_body_size 0;

        # nginx handles gzip compression for API responses now that the
        # backend no longer compresses (ENABLE_COMPRESSION=false).
        # The server-level gzip directive covers this location.

        # Buffer the full response so nginx can gzip it properly.
        proxy_buffering on;

        proxy_http_version 1.1;

        # File-tunnel ops wait up to 60s for the agent. Default nginx
        # proxy_read_timeout is 60s, so a slow/timeout response races the
        # gateway and can surface as a bare 504 with no backend body.
        # Keep headroom above REQUEST_TIMEOUT_MS so backend JSON wins.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Pass backend errors through as-is (don't show nginx error pages)
        proxy_intercept_errors off;
    }

    # Auth routes proxy -> backend
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        # Auth responses are regular request/response — safe to buffer + gzip
        proxy_buffering on;
        proxy_http_version 1.1;
    }

    # WebSocket proxy -> backend
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Marketplace-installed plugin frontend bundles (frontend.mjs).
    # ^~ beats the static-asset regex and the SPA fallback so updates
    # are never served as index.html or cached immutable JS.
    location ^~ /plugins-assets/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_http_version 1.1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Docs / Swagger UI
    location /docs {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_http_version 1.1;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker — no caching
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
}

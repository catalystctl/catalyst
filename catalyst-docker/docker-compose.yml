# =============================================================================
# Catalyst — Docker Compose (standalone, pre-built images)
#
# Quick start:
#   1. cp .env.example .env
#   2. Edit .env — set POSTGRES_PASSWORD and BETTER_AUTH_SECRET
#   3. docker compose up -d
#   4. Visit http://<your-host> and register the first admin user
#
# The first registered user automatically becomes the administrator.
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: catalyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalyst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: catalyst_db
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - catalyst-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d catalyst_db: without an explicit DB, pg_isready defaults to a database
      # named after the user ("catalyst"), which does not exist (POSTGRES_DB is
      # catalyst_db). That spams FATAL logs and can confuse install debugging
      # (see GitHub issue #206).
      test: ["CMD-SHELL", "pg_isready -U catalyst -d catalyst_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: catalyst-redis
    restart: unless-stopped
    # SECURITY: enforce the generated REDIS_PASSWORD instead of running an
    # unauthenticated redis (the .env generator creates the credential).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      # REDISCLI_AUTH is read by redis-cli automatically — avoids putting the
      # password on the healthcheck command line (visible in docker inspect
      # and the container process list).
      test: "redis-cli --no-auth-warning ping | grep PONG"
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  # ===========================================================================
  # Backend
  # ===========================================================================
  backend:
    image: ghcr.io/catalystctl/catalyst-backend:latest
    container_name: catalyst-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      PORT: 3000

      # Database
      # NOTE: POSTGRES_PASSWORD is only applied by the official Postgres image on
      # FIRST volume initialization. Changing it in .env later without wiping
      # catalyst-postgres-data leaves the DB user on the old password and causes
      # Prisma P1000 ("password authentication failed for user catalyst").
      # Compose does not URL-encode ${POSTGRES_PASSWORD}; install.sh generates
      # URL-safe passwords (no /+=). If you set a custom password with special
      # characters, URL-encode them in a full DATABASE_URL override instead.
      DATABASE_URL: postgresql://catalyst:${POSTGRES_PASSWORD}@postgres:5432/catalyst_db

      # Redis
      # NOTE: no Redis client exists in the backend yet — kept for future use.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Auth / Security
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost}
      # Passkey RP ID must be the bare hostname from PUBLIC_URL (no scheme, no port).
      # Defaults to localhost; override if PUBLIC_URL uses a real domain.
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}

      # HMAC secret for hashing panel/agent API keys (api-key-service).
      # Defaults to BETTER_AUTH_SECRET so one-liner installs keep working without
      # an extra prompt; override independently for key-rotation isolation.
      API_KEY_SECRET: ${API_KEY_SECRET:-${BETTER_AUTH_SECRET}}

      # CORS — PUBLIC_URL by default. Set CORS_ORIGIN to a comma-separated
      # list to allow extra panel hosts (LAN IP + domain).
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_URL:-http://localhost}}
      FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-http://localhost}}

      # Public address used in deploy scripts, agent config, and email links.
      # Defaults to PUBLIC_URL. Override BACKEND_EXTERNAL_ADDRESS / BACKEND_URL
      # for split panel/API hosts so agents skip the frontend proxy.
      BACKEND_EXTERNAL_ADDRESS: ${BACKEND_EXTERNAL_ADDRESS:-${PUBLIC_URL:-http://localhost}}
      BACKEND_URL: ${BACKEND_URL:-${PUBLIC_URL:-http://localhost}}

      # SFTP runs on the node agent (default port 2022), not in this container.
      # The per-node SFTP port is written into the agent config by deploy-agent.sh;
      # this panel only issues SFTP tokens (/api/sftp/connection-info).

      # Deploy script (baked into the image)
      DEPLOY_SCRIPT_PATH: /scripts/deploy-agent.sh

      # Data directories
      SERVER_DATA_DIR: /var/lib/catalyst/servers
      BACKUP_DIR: /var/lib/catalyst/backups
      BACKUP_STORAGE_MODE: ${BACKUP_STORAGE_MODE:-local}
      BACKUP_STREAM_DIR: /tmp/catalyst-backup-stream
      BACKUP_TRANSFER_DIR: /tmp/catalyst-backup-transfer

      # S3 backups (only used when BACKUP_STORAGE_MODE=s3)
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-}
      BACKUP_CREDENTIALS_ENCRYPTION_KEY: ${BACKUP_CREDENTIALS_ENCRYPTION_KEY:-}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-8388608}

      # App
      APP_NAME: ${APP_NAME:-Catalyst}
      # Compression is handled by nginx reverse proxy — disable Fastify's
      # @fastify/compress to prevent "premature close" stream errors that
      # truncate compressed responses when nginx closes the upstream connection
      # before the compression stream finishes flushing.
      ENABLE_COMPRESSION: ${ENABLE_COMPRESSION:-false}

      # Webhooks (optional)
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # Suspension (optional)
      SUSPENSION_ENFORCED: ${SUSPENSION_ENFORCED:-true}
      SUSPENSION_DELETE_BLOCKED: ${SUSPENSION_DELETE_BLOCKED:-false}
      SUSPENSION_DELETE_POLICY: ${SUSPENSION_DELETE_POLICY:-keep}

      # Plugins
      PLUGINS_DIR: /var/lib/catalyst/plugins
      # Marketplace sources; empty = official catalyst-plugins index (built in).
      PLUGIN_MARKETPLACE_URLS: ${PLUGIN_MARKETPLACE_URLS:-}

      # OAuth (optional — leave empty to disable)
      WHMCS_OIDC_CLIENT_ID: ${WHMCS_OIDC_CLIENT_ID:-}
      WHMCS_OIDC_CLIENT_SECRET: ${WHMCS_OIDC_CLIENT_SECRET:-}
      WHMCS_OIDC_DISCOVERY_URL: ${WHMCS_OIDC_DISCOVERY_URL:-}
      PAYMENTER_OIDC_CLIENT_ID: ${PAYMENTER_OIDC_CLIENT_ID:-}
      PAYMENTER_OIDC_CLIENT_SECRET: ${PAYMENTER_OIDC_CLIENT_SECRET:-}
      PAYMENTER_OIDC_DISCOVERY_URL: ${PAYMENTER_OIDC_DISCOVERY_URL:-}

      # Auto Updater
      AUTO_UPDATE_ENABLED: ${AUTO_UPDATE_ENABLED:-false}
      AUTO_UPDATE_INTERVAL_MS: ${AUTO_UPDATE_INTERVAL_MS:-3600000}
      AUTO_UPDATE_AUTO_TRIGGER: ${AUTO_UPDATE_AUTO_TRIGGER:-false}
      # Host path of this compose project, bind-mounted at the same path so
      # `docker compose -f ...` inside the container is valid to the host daemon.
      AUTO_UPDATE_DOCKER_COMPOSE_PATH: ${AUTO_UPDATE_DOCKER_COMPOSE_PATH:-${CATALYST_COMPOSE_DIR:-/opt/catalyst-docker}/docker-compose.yml}

      # Misc tuning (unlikely to need changing)
      CONSOLE_OUTPUT_BYTE_LIMIT_BYTES: ${CONSOLE_OUTPUT_BYTE_LIMIT_BYTES:-524288}
      MAX_DISK_MB: ${MAX_DISK_MB:-1048576}
    ports:
      # No SFTP publish here — port 2022 belongs to the node agent.
      - "${BACKEND_PORT:-127.0.0.1:3000}:3000"
    volumes:
      - catalyst-server-data:/var/lib/catalyst/servers
      - catalyst-backup-data:/var/lib/catalyst/backups
      - catalyst-plugin-data:/var/lib/catalyst/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CATALYST_COMPOSE_DIR:-/opt/catalyst-docker}:${CATALYST_COMPOSE_DIR:-/opt/catalyst-docker}:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Frontend (Nginx)
  # ===========================================================================
  frontend:
    image: ghcr.io/catalystctl/catalyst-frontend:latest
    container_name: catalyst-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-0.0.0.0:80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  catalyst-postgres-data:
    driver: local
  catalyst-server-data:
    driver: local
  catalyst-backup-data:
    driver: local
  catalyst-plugin-data:
    driver: local

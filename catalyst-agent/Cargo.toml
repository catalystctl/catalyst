[package]
name = "catalyst-agent"
version = "1.26.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = [
    "macros", "rt-multi-thread", "fs", "time", "sync",
    "process", "io-util", "signal", "net"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.11"
aes-gcm = "0.11"
rand = "0.10"
base64 = "0.23"
sysinfo = "0.39"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
num_cpus = "1"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
# reqwest 0.13: `rustls` enables platform verifier (replaces rustls-native-certs feature)
reqwest = { version = "0.13", features = ["json", "stream", "rustls"], default-features = false }
containerd-client = "0.9"
tonic = "0.14"
prost-types = "0.14"
# russh 0.62 folds keys into the main crate; keep ssh-key for host-key IO helpers
russh = "0.62"
russh-sftp = "2.4"
ssh-key = "0.7.0-rc"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[profile.release.build-override]
opt-level = 0
codegen-units = 16

# Static musl binaries for host install (no libc on the node).
# gnu targets stay dynamically linked for the optional Docker image.

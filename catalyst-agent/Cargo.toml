[package]
name = "catalyst-agent"
version = "1.15.13"
edition = "2021"

[dependencies]
tokio = { version = "1.52", features = [
    "macros", "rt-multi-thread", "fs", "time", "sync",
    "process", "io-util", "signal", "net"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"
sha2 = "0.11"
aes-gcm = "0.10"
rand_08 = { package = "rand", version = "0.8" }
base64 = "0.22"
sysinfo = "0.39"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
num_cpus = "1"
libc = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "stream", "rustls", "rustls-native-certs"], default-features = false }
containerd-client = "0.9"
tonic = "0.14"
prost-types = "0.14"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
ssh-key = "0.6"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[profile.release.build-override]
opt-level = 0
codegen-units = 16
